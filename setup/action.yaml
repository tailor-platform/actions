name: Set up Tailor Platform toolchain
description: >-
  Set up the package manager and Node.js (or Bun) so subsequent steps can run
  tailor. Does not install project dependencies — use the 'install' action
  for that. The caller is responsible for checking out the repository first.

inputs:
  package-manager:
    description: Package manager to use (pnpm, npm, yarn, or bun)
    required: true
  node-version-file:
    description: File to read the Node.js version from
    required: false
    default: package.json

runs:
  using: composite
  steps:
    - name: Set up pnpm
      if: inputs.package-manager == 'pnpm'
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

    - name: Set up Node.js
      if: inputs.package-manager != 'bun'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: ${{ inputs.node-version-file }}
        cache: ${{ inputs.package-manager != 'yarn' && inputs.package-manager || '' }}

    - name: Set up Yarn
      if: inputs.package-manager == 'yarn'
      shell: bash
      run: | # zizmor: ignore[adhoc-packages,github-env]
        corepack_dir="$RUNNER_TEMP/tailor-corepack"
        bin_dir="$corepack_dir/bin"
        if [ "$RUNNER_OS" = Windows ]; then bin_dir="$corepack_dir"; fi
        npm install --global --prefix "$corepack_dir" corepack@0.36.0
        "$bin_dir/corepack" enable --install-directory "$bin_dir" yarn
        echo "$bin_dir" >> "$GITHUB_PATH"

    - name: Restore the Yarn cache
      if: inputs.package-manager == 'yarn'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: ${{ inputs.node-version-file }}
        cache: yarn

    - name: Set up Bun
      if: inputs.package-manager == 'bun'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
