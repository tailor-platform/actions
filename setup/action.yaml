name: Set up Tailor Platform toolchain
description: >-
  Set up the package manager and Node.js (or Bun) so subsequent steps can run
  tailor. Does not install project dependencies — use the 'install' action
  for that. The caller is responsible for checking out the repository first.

inputs:
  package-manager:
    description: Package manager to use (pnpm, npm, yarn, or bun)
    required: true
  node-version-file:
    description: File to read the Node.js version from
    required: false
    default: package.json

runs:
  using: composite
  steps:
    - name: Set up pnpm
      if: inputs.package-manager == 'pnpm'
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

    - name: Set up Node.js
      if: inputs.package-manager != 'bun'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: ${{ inputs.node-version-file }}
        cache: ${{ inputs.package-manager }}

    - name: Set up Bun
      if: inputs.package-manager == 'bun'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
