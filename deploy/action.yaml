name: Deploy to Tailor Platform
description: >-
  Deploy application to Tailor Platform.
  Requires Node.js and dependencies to be installed by the caller.

inputs:
  workspace-id:
    description: >-
      Tailor Platform workspace ID to deploy to.
      Set this from a GitHub Environment variable (e.g. vars.TAILOR_PLATFORM_WORKSPACE_ID).
    required: true
  working-directory:
    description: Working directory for the project (for monorepo setups)
    required: false
    default: "."
  package-manager:
    description: >-
      Package manager used to run tailor-sdk (pnpm, npm, yarn, or bun).
      Defaults to npx when empty, so Bun uses its own runtime instead of
      relying on an ambient Node, and the locally-installed version is used.
    required: false
    default: ""
  platform-client-id:
    description: OAuth2 client ID for Tailor Platform machine user
    required: true
  platform-client-secret:
    description: OAuth2 client secret for Tailor Platform machine user
    required: true
  mention:
    description: >-
      Comma-separated GitHub usernames to @mention in a PR comment when deploy
      completes (e.g. "user1,user2"). When empty, no mention comment is posted.
      Requires github-token with pull-requests:write permission.
    required: false
    default: ""
  github-token:
    description: >-
      GitHub token for posting the @mention PR comment.
      Required when mention is set.
    required: false
    default: ""

outputs:
  workspace-id:
    description: Tailor Platform workspace ID
    value: ${{ inputs.workspace-id }}
  app-url:
    description: Application URL (GraphQL endpoint) of the deployed workspace
    value: ${{ steps.show.outputs.app-url }}

runs:
  using: composite
  steps:
    - name: Mask credentials
      shell: bash
      run: |
        echo "::add-mask::$CLIENT_ID"
        echo "::add-mask::$CLIENT_SECRET"
      env:
        CLIENT_ID: ${{ inputs.platform-client-id }}
        CLIENT_SECRET: ${{ inputs.platform-client-secret }}

    - name: Resolve tailor-sdk runner
      shell: bash
      env:
        PACKAGE_MANAGER: ${{ inputs.package-manager }}
      # RUN is one of a fixed set of literals chosen by the case below (never
      # user input), so writing it to GITHUB_ENV cannot inject code.
      run: | # zizmor: ignore[github-env]
        case "$PACKAGE_MANAGER" in
          pnpm) RUN="pnpm exec" ;;
          yarn) RUN="yarn" ;;
          bun)  RUN="bunx" ;;
          npm|"") RUN="npx" ;;
          *)
            echo "::error::Unsupported package-manager '$PACKAGE_MANAGER' (expected pnpm, npm, yarn, or bun)"
            exit 1
            ;;
        esac
        echo "TAILOR_SDK_RUN=$RUN" >> "$GITHUB_ENV"

    - name: Login to Tailor Platform
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TAILOR_PLATFORM_MACHINE_USER_CLIENT_ID: ${{ inputs.platform-client-id }}
        TAILOR_PLATFORM_MACHINE_USER_CLIENT_SECRET: ${{ inputs.platform-client-secret }}
      run: $TAILOR_SDK_RUN tailor-sdk login --machineuser

    - name: Validate workspace-id
      shell: bash
      env:
        WORKSPACE_ID: ${{ inputs.workspace-id }}
      run: |
        if [ -z "$WORKSPACE_ID" ]; then
          echo "::error::Workspace is not provisioned: TAILOR_PLATFORM_WORKSPACE_ID is empty. Provision the workspace and set the variable."
          exit 1
        fi

    - name: Generate types
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TAILOR_PLATFORM_WORKSPACE_ID: ${{ inputs.workspace-id }}
      run: $TAILOR_SDK_RUN tailor-sdk generate

    - name: Deploy
      id: apply
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TAILOR_PLATFORM_WORKSPACE_ID: ${{ inputs.workspace-id }}
      run: $TAILOR_SDK_RUN tailor-sdk apply --yes

    - name: Resolve app URL
      id: show
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TAILOR_PLATFORM_WORKSPACE_ID: ${{ inputs.workspace-id }}
      run: |
        if APP_JSON=$($TAILOR_SDK_RUN tailor-sdk show --json 2>/dev/null); then
          APP_URL=$(echo "$APP_JSON" | jq -r '.url // ""')
        else
          APP_URL=""
        fi
        echo "app-url=$APP_URL" >> "$GITHUB_OUTPUT"

    - name: Post mention comment
      if: always() && inputs.mention != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        MENTION_USERS: ${{ inputs.mention }}
        APPLY_OUTCOME: ${{ steps.apply.outcome }}
        WORKSPACE_ID: ${{ inputs.workspace-id }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        if [ -z "$GH_TOKEN" ]; then
          echo "::warning::mention is set but github-token is not provided — skipping mention comment"
          exit 0
        fi

        MENTIONS=$(printf '%s' "$MENTION_USERS" | tr ',' '\n' | \
          sed 's/^[[:space:]]*//' | sed 's/[[:space:]]*$//' | \
          grep -v '^$' | sed 's/^@*//' | sed 's/^/@/' | tr '\n' ' ' | xargs)

        PR_NUM=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
          --jq '.[0].number // empty' 2>/dev/null || echo "")

        if [ -z "$PR_NUM" ]; then
          echo "::notice::No PR associated with this commit — skipping mention comment"
          exit 0
        fi

        if [ "$APPLY_OUTCOME" = "success" ]; then
          EMOJI="✅"
          STATUS="succeeded"
        else
          EMOJI="❌"
          STATUS="failed"
        fi

        gh pr comment "$PR_NUM" --body "${EMOJI} Deploy \`${WORKSPACE_ID}\` ${STATUS} — ${MENTIONS}
[View run](${RUN_URL})"
