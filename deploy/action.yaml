name: Deploy to Tailor Platform
description: >-
  Deploy application to Tailor Platform.
  Requires Node.js and dependencies to be installed by the caller.

inputs:
  workspace-id:
    description: >-
      Tailor Platform workspace ID to deploy to.
      Set this from a GitHub Environment variable (e.g. vars.TAILOR_PLATFORM_WORKSPACE_ID).
    required: true
  working-directory:
    description: Working directory for the project (for monorepo setups)
    required: false
    default: "."
  package-manager:
    description: >-
      Package manager used to run tailor (pnpm, npm, yarn, or bun).
      Defaults to npx when empty, so Bun uses its own runtime instead of
      relying on an ambient Node, and the locally-installed version is used.
    required: false
    default: ""
  bundle-cache:
    description: >-
      Restore the SDK bundle cache (.tailor/cache) with actions/cache before deploying,
      and save it afterwards on push, workflow_dispatch, and schedule runs of a branch.
      Set to "false" to do neither.
    required: false
    default: "true"
  platform-client-id:
    description: OAuth2 client ID for Tailor Platform machine user
    required: true
  platform-client-secret:
    description: OAuth2 client secret for Tailor Platform machine user
    required: true

outputs:
  workspace-id:
    description: Tailor Platform workspace ID
    value: ${{ inputs.workspace-id }}
  app-urls:
    description: JSON object mapping all application names in the workspace to their base URLs; {} when none exist
    value: ${{ steps.applications.outputs.app-urls }}
  console-urls:
    description: JSON object mapping application names to Console URLs; {} when unavailable
    value: ${{ steps.applications.outputs.console-urls }}
  app-url:
    description: Deprecated; will be removed in the next major version. Application URL (GraphQL endpoint) of the deployed workspace
    value: ${{ steps.deploy.outputs.app-url }}
  frontend-urls:
    description: Deprecated; will be removed in the next major version. JSON object mapping all static website names in the workspace to URLs; {} when none exist
    value: ${{ steps.frontends.outputs.frontend-urls }}

runs:
  using: composite
  steps:
    - name: Set up Tailor SDK
      uses: tailor-platform/actions/_internal/sdk-setup@053ee1c31460fc04639c466e5f483ea3150a9a31
      with:
        platform-client-id: ${{ inputs.platform-client-id }}
        platform-client-secret: ${{ inputs.platform-client-secret }}
        package-manager: ${{ inputs.package-manager }}
        working-directory: ${{ inputs.working-directory }}

    - name: Validate workspace-id
      shell: bash
      env:
        WORKSPACE_ID: ${{ inputs.workspace-id }}
      run: |
        if [ -z "$WORKSPACE_ID" ]; then
          echo "::error::Workspace is not provisioned: TAILOR_PLATFORM_WORKSPACE_ID is empty. Provision the workspace and set the variable."
          exit 1
        fi

    - name: Resolve bundle cache
      id: bundle-cache
      if: inputs.bundle-cache == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: node "$GITHUB_ACTION_PATH/../_internal/lib/bundle-cache.mjs" restore >> "$GITHUB_OUTPUT"

    - name: Restore bundle cache
      id: bundle-cache-restore
      if: steps.bundle-cache.outputs.prefix != ''
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.bundle-cache.outputs.path }}
        key: ${{ steps.bundle-cache.outputs.prefix }}

    - name: Deploy
      id: deploy
      uses: tailor-platform/actions/_internal/deploy@053ee1c31460fc04639c466e5f483ea3150a9a31
      with:
        workspace-id: ${{ inputs.workspace-id }}
        working-directory: ${{ inputs.working-directory }}

    - name: Resolve bundle cache key
      id: bundle-cache-key
      if: ${{ !cancelled() && steps.bundle-cache.outputs.prefix != '' && startsWith(github.ref, 'refs/heads/') && contains(fromJSON('["push", "workflow_dispatch", "schedule"]'), github.event_name) }}
      shell: bash
      env:
        PREFIX: ${{ steps.bundle-cache.outputs.prefix }}
        CACHE_PATH: ${{ steps.bundle-cache.outputs.path }}
      run: node "$GITHUB_ACTION_PATH/../_internal/lib/bundle-cache.mjs" save-key "$PREFIX" "$CACHE_PATH" >> "$GITHUB_OUTPUT"

    - name: Save bundle cache
      id: bundle-cache-save
      if: ${{ !cancelled() && steps.bundle-cache-key.outputs.key != '' && steps.bundle-cache-key.outputs.key != steps.bundle-cache-restore.outputs.cache-matched-key }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.bundle-cache.outputs.path }}
        key: ${{ steps.bundle-cache-key.outputs.key }}

    - name: Resolve application URLs
      id: applications
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TAILOR_PLATFORM_WORKSPACE_ID: ${{ inputs.workspace-id }}
      run: |
        if APPLICATIONS=$($TAILOR_RUN tailor workspace app list --limit 0 --json) &&
          APP_URLS=$(printf '%s\n' "$APPLICATIONS" | jq -ce 'map({key: .name, value: ("https://" + .domain)}) | from_entries'); then
          :
        else
          echo "::warning::Could not resolve application URLs; deployment succeeded but app-urls is unavailable"
          APP_URLS='{}'
        fi
        printf 'app-urls=%s\n' "$APP_URLS" >> "$GITHUB_OUTPUT"

        if CONSOLE_URLS=$(APP_URLS="$APP_URLS" node <<'NODE'
        let base = process.env.TAILOR_PLATFORM_CONSOLE_URL;
        if (!base && process.env.TAILOR_PLATFORM_URL) {
          const platform = new URL(process.env.TAILOR_PLATFORM_URL);
          platform.hostname = platform.hostname.replace(/^[^.]+/, "console");
          base = platform.origin;
        }
        base ||= "https://console.tailor.tech";
        const workspace = encodeURIComponent(process.env.TAILOR_PLATFORM_WORKSPACE_ID);
        const urls = Object.fromEntries(Object.keys(JSON.parse(process.env.APP_URLS)).map(name => [
          name,
          new URL(`/workspaces/${workspace}/services/applications/${encodeURIComponent(name)}`, base).href,
        ]));
        console.log(JSON.stringify(urls));
        NODE
        ); then
          :
        else
          echo "::warning::Could not resolve console URLs; deployment succeeded but console-urls is unavailable"
          CONSOLE_URLS='{}'
        fi
        printf 'console-urls=%s\n' "$CONSOLE_URLS" >> "$GITHUB_OUTPUT"

    - name: Resolve frontend URLs
      id: frontends
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TAILOR_PLATFORM_WORKSPACE_ID: ${{ inputs.workspace-id }}
      run: |
        WEBSITES=$($TAILOR_RUN tailor staticwebsite list --json)
        FRONTEND_URLS=$(printf '%s\n' "$WEBSITES" | jq -ce 'map({key: .name, value: .url}) | from_entries')
        printf 'frontend-urls=%s\n' "$FRONTEND_URLS" >> "$GITHUB_OUTPUT"
