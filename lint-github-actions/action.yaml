name: Lint GitHub Actions workflows and action definitions
description: >-
  Run zizmor's security audit (missing SHA pins, pull_request_target misuse,
  script injection via untrusted input, overly broad permissions, etc.)
  against workflows and action definitions. Requires the repository to be
  checked out.

inputs:
  paths:
    description: >-
      List of paths to audit, passed through unquoted to zizmor-action's
      `inputs` and split there by the shell's default word-splitting rules —
      so either spaces or newlines between paths work as separators
      (interchangeably, and either can be used to list multiple paths).
      Defaults to the whole repository. Use this to scope the audit to just
      the files changed in a PR (e.g. the output of a changed-files action,
      space- or newline-separated). Passing an empty string is NOT the same
      as omitting this input — it overrides the "." default and gives zizmor
      no paths to audit, which fails the run. When pairing this with a
      changed-files action, guard the step with `if:` so it's skipped
      entirely when no matching files changed.
    required: false
    default: "."
  zizmor-advanced-security:
    description: >-
      Upload zizmor's findings to the repository's Security tab (GitHub
      Advanced Security) as SARIF instead of plain workflow annotations.
      Requires GHAS to be enabled on the repository (free for public repos,
      license-gated for private ones).
    required: false
    default: "false"
  github-token:
    description: GitHub token for zizmor's online audits
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: zizmor
      uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
      with:
        inputs: ${{ inputs.paths }}
        token: ${{ inputs.github-token }}
        advanced-security: ${{ inputs.zizmor-advanced-security }}
        # zizmor-action rejects annotations: true together with
        # advanced-security: true, so only request annotations when SARIF
        # upload is off.
        annotations: ${{ inputs.zizmor-advanced-security != 'true' }}
