name: Audit lockfile for vulnerabilities
description: >-
  Audit the selected pnpm-lock.yaml and fail on any vulnerability at or above
  audit-level, including pre-existing vulnerabilities. Audit errors also fail.
  Requires pnpm to be set up by the caller; no dependency install or base
  commit history is needed.

inputs:
  audit-level:
    description: >-
      Minimum severity to report, passed through to `pnpm audit
      --audit-level`. One of low, moderate, high, critical.
    required: false
    default: moderate
  base-sha:
    description: Deprecated and ignored. The action always audits the current lockfile.
    required: false
    default: ""
  working-directory:
    description: Working directory containing pnpm-lock.yaml (for monorepo setups)
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Audit lockfile for vulnerabilities
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        AUDIT_LEVEL: ${{ inputs.audit-level }}
      run: node "${{ github.action_path }}/lockfile-audit.mjs"
