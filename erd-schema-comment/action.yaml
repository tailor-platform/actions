name: Post ERD schema preview links for a pull request
description: >-
  List this run's uploaded *.html artifacts and post or update a sticky PR
  comment linking to each one, labeled by artifact name minus the .html
  extension. Run this once per PR (e.g. in a job that needs: every
  erd-schema-preview matrix leg), after uploading each namespace's
  artifact with a name like "<namespace>.html". A namespace erd-schema-preview
  skipped as irrelevant simply has no matching artifact and is naturally
  omitted on GitHub.com and Enterprise Cloud. On GitHub Enterprise Server, pass candidate
  names in preview-artifact-names: v3 artifacts are not discoverable
  through the REST API until the run completes. The comment links to the
  run page and explains how to download and open the ZIP artifacts.

inputs:
  preview-artifact-names:
    description: >-
      JSON array of candidate preview artifact names (e.g.
      ["tailordb.html", "analyticsdb.html"]). Required on GitHub
      Enterprise Server; ignored on GitHub.com and Enterprise Cloud.
      Include the names used by the preview jobs; irrelevant namespaces
      produce no artifact. Pass [] when there are no candidates.
    required: false
    default: ""
  base-ref:
    description: >-
      Base branch name to mention in the comment (e.g. "the diff is
      against main"). Omit to skip that phrase.
    required: false
    default: ""
  run-id:
    description: Run whose artifacts to list. Defaults to the current run.
    required: false
    default: ${{ github.run_id }}
  github-token:
    description: GitHub token with pull-requests:write and actions:read permission
    required: true
  pr-number:
    description: Pull request number. Defaults to the current PR number.
    required: false
    default: ""

outputs:
  comment-id:
    description: ID of the created or updated comment
    value: ${{ steps.comment.outputs.comment-id }}

runs:
  using: composite
  steps:
    - name: List preview artifacts
      id: list
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_ENTERPRISE_TOKEN: ${{ inputs.github-token }}
        RUN_ID: ${{ inputs.run-id }}
        SERVER_URL: ${{ github.server_url }}
        REPO: ${{ github.repository }}
        PREVIEW_ARTIFACT_NAMES: ${{ inputs.preview-artifact-names }}
      run: |
        set -euo pipefail
        export GH_HOST="${GITHUB_SERVER_URL#*://}"
        case "$SERVER_URL" in
          https://github.com|https://*.ghe.com)
            LINKS=$(gh api --paginate --slurp "repos/$REPO/actions/runs/$RUN_ID/artifacts" | \
              jq --arg server_url "$SERVER_URL" --arg repo "$REPO" --arg run_id "$RUN_ID" \
              '[ .[].artifacts[] | select(.name | endswith(".html")) ] | sort_by(.name) |
               [ .[] | {label: (.name | rtrimstr(".html")), url: ($server_url + "/" + $repo + "/actions/runs/" + $run_id + "/artifacts/" + (.id | tostring))} ]')
            ;;
          *)
            if [ -z "$PREVIEW_ARTIFACT_NAMES" ] || ! printf '%s' "$PREVIEW_ARTIFACT_NAMES" | jq -e \
              'type == "array" and all(.[]; type == "string" and endswith(".html") and (contains("/") | not))' >/dev/null; then
              echo "::error::preview-artifact-names must be a JSON array of .html filenames on GitHub Enterprise Server. Use [] when there are no candidates."
              exit 1
            fi
            LINKS=$(printf '%s' "$PREVIEW_ARTIFACT_NAMES" | \
              jq --arg url "$SERVER_URL/$REPO/actions/runs/$RUN_ID" \
              'unique | map({label: rtrimstr(".html"), url: $url})')
            ;;
        esac

        EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
        {
          echo "links<<$EOF"
          echo "$LINKS"
          echo "$EOF"
        } >>"$GITHUB_OUTPUT"

    - name: Post or update comment
      id: comment
      uses: tailor-platform/actions/_internal/erd-comment@57167ea818c5819ead1f422bc53b74294ac5273e
      with:
        links: ${{ steps.list.outputs.links }}
        base-ref: ${{ inputs.base-ref }}
        github-token: ${{ inputs.github-token }}
        pr-number: ${{ inputs.pr-number }}
