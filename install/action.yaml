name: Install Tailor Platform project dependencies
description: >-
  Install project dependencies for the configured package manager.
  Requires the package manager and Node.js (or Bun) to be set up first
  (use the 'setup' action). The caller is responsible for checking out
  the repository first.

inputs:
  package-manager:
    description: Package manager to use (pnpm, npm, yarn, or bun)
    required: true
  working-directory:
    description: Working directory to install dependencies in (for monorepo setups)
    required: false
    default: "."
  install-command:
    description: >-
      Override the dependency-install command (e.g. a filtered monorepo
      install). When empty, a frozen-lockfile install for the selected
      package manager is used.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PACKAGE_MANAGER: ${{ inputs.package-manager }}
        INSTALL_COMMAND: ${{ inputs.install-command }}
      run: |
        if [ -n "$INSTALL_COMMAND" ]; then
          bash -c "$INSTALL_COMMAND"
        else
          case "$PACKAGE_MANAGER" in
            pnpm) pnpm install --frozen-lockfile ;;
            npm)  npm ci ;;
            yarn) yarn install --frozen-lockfile ;;
            bun)  bun install --frozen-lockfile ;;
            *)
              echo "::error::Unsupported package-manager '$PACKAGE_MANAGER' (expected pnpm, npm, yarn, or bun)"
              exit 1
              ;;
          esac
        fi
