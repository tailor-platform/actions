# Own package: no supply-chain reason to wait out the default 24h window.
minimumReleaseAgeExclude:
  - '@tailor-platform/*'

allowBuilds:
  '@prisma/engines': true
  '@swc/core': true
  '@tailor-platform/sdk': true
  esbuild: true
  multiline-ts: true
  protobufjs: true

overrides:
  zod@<4.6.6: ^4.6.6
