# @tailor-platform/sdk 2.0.0-next.4 pins undici to exactly 8.6.0 (GHSA advisories,
# fixed in 8.9.0); drop this override once the SDK bumps past 8.9.0.
overrides:
  undici: '^8.9.0'

allowBuilds:
  '@prisma/engines': true
  '@swc/core': true
  '@tailor-platform/sdk': true
  esbuild: true
  multiline-ts: true
  protobufjs: true
