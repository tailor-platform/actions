name: CI

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  build:
    # References a job that doesn't exist anywhere in this workflow —
    # exercises actionlint's job-dependency-graph check.
    needs: nonexistent-job
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run a harmless command
        run: echo "ok"
