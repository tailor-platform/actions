name: CI

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # Deliberately pinned to a floating tag instead of a commit SHA, to
      # exercise zizmor's unpinned-uses audit.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run a harmless command
        run: echo "ok"
