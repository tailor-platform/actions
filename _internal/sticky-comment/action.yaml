name: Post PR comment
description: >-
  Post a PR comment whose first line is the marker. By default a new comment is
  created and every earlier visible bot comment whose body starts with
  marker-prefix is hidden as outdated. With sticky set to "true" the newest such
  comment is updated in place instead.
  Internal action — use via preview-comment, preview-cleanup, or plan actions.

inputs:
  marker-prefix:
    description: >-
      String to identify the existing comment (body.startsWith check).
      Use the full marker for exact matches, or a prefix for markers that embed
      a variable (e.g. "<!-- tailor-preview: workspace-name ").
    required: true
  body:
    description: Full comment body to post or update (must start with the marker line)
    required: true
  github-token:
    description: GitHub token with pull-requests:write permission
    required: true
  sticky:
    description: >-
      Set to "true" to update the newest comment that starts with marker-prefix
      in place. Otherwise a new comment is posted and the earlier comments with the
      marker are hidden as outdated.
    required: false
    default: "false"
  pr-number:
    description: Pull request number. Defaults to the current PR number.
    required: false
    default: ""

outputs:
  comment-id:
    description: ID of the created or updated comment
    value: ${{ steps.post.outputs.comment-id }}
  existing-body:
    description: >-
      Body of the earlier comment with the marker (empty when there was none).
      The newest one when sticky is off, the one that was updated when sticky is "true".
    value: ${{ steps.post.outputs.existing-body }}

runs:
  using: composite
  steps:
    - name: Post comment
      id: post
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_ENTERPRISE_TOKEN: ${{ inputs.github-token }}
        MARKER_PREFIX: ${{ inputs.marker-prefix }}
        BODY: ${{ inputs.body }}
        STICKY: ${{ inputs.sticky }}
        PR_NUMBER: ${{ inputs.pr-number || github.event.pull_request.number }}
      run: |
        export GH_HOST="${GITHUB_SERVER_URL#*://}"
        if [ -z "$PR_NUMBER" ]; then
          echo "::notice::sticky-comment: not a pull_request event — skipping"
          exit 0
        fi

        if [ "${BODY:0:${#MARKER_PREFIX}}" != "$MARKER_PREFIX" ]; then
          echo "::error::sticky-comment: body must start with marker-prefix"
          exit 1
        fi

        list_matches() {
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" | \
            jq -c --arg m "$MARKER_PREFIX" \
              '[ .[][] | select(.user.type == "Bot" and (.body | startswith($m))) | {id: .id, node_id: .node_id, body: .body} ]'
        }

        MATCHES=$(list_matches)
        EXISTING_BODY=$(printf '%s' "$MATCHES" | jq -r 'last | .body // empty')

        EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
        {
          echo "existing-body<<$EOF"
          echo "$EXISTING_BODY"
          echo "$EOF"
        } >> "$GITHUB_OUTPUT"

        PAYLOAD=$(jq -n --arg body "$BODY" '{body: $body}')
        if [ "$STICKY" = "true" ]; then
          EXISTING_ID=$(printf '%s' "$MATCHES" | jq -r 'last | .id // empty')
          if [ -n "$EXISTING_ID" ]; then
            echo "$PAYLOAD" | gh api "repos/$GITHUB_REPOSITORY/issues/comments/$EXISTING_ID" \
              -X PATCH --input - > /dev/null
            echo "comment-id=$EXISTING_ID" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        fi

        COMMENT_ID=$(echo "$PAYLOAD" | gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
          -X POST --input - | jq -r '.id // empty')
        if [ -z "$COMMENT_ID" ]; then
          echo "::error::sticky-comment: failed to create comment (no id returned)"
          exit 1
        fi
        echo "comment-id=$COMMENT_ID" >> "$GITHUB_OUTPUT"

        if [ "$STICKY" = "true" ]; then
          exit 0
        fi

        # Hide only after the new comment exists, so a failed post never leaves the PR
        # without a visible comment. Comments newer than ours belong to a concurrent run.
        if ! OLDER=$(list_matches | jq -c --argjson id "$COMMENT_ID" '[ .[] | select(.id < $id) | .node_id ]'); then
          echo "::warning::sticky-comment: could not list the earlier comments to hide"
          exit 0
        fi
        if [ "$(printf '%s' "$OLDER" | jq length)" = "0" ]; then
          exit 0
        fi
        NODE_IDS=$(printf '%s' "$OLDER" | jq -r 'map("\"" + . + "\"") | join(",")')
        if ! VISIBLE=$(gh api graphql -f query="query { nodes(ids: [$NODE_IDS]) { ... on IssueComment { id isMinimized } } }" | \
          jq -r '.data.nodes[] | select(.isMinimized == false) | .id'); then
          echo "::warning::sticky-comment: could not check which earlier comments are hidden"
          exit 0
        fi
        while read -r NODE_ID; do
          [ -n "$NODE_ID" ] || continue
          if ! gh api graphql \
            -f query='mutation($id: ID!) { minimizeComment(input: {subjectId: $id, classifier: OUTDATED}) { minimizedComment { isMinimized } } }' \
            -f id="$NODE_ID" > /dev/null; then
            echo "::warning::sticky-comment: could not hide the earlier comment $NODE_ID"
          fi
        done <<< "$VISIBLE"
