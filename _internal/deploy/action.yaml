name: Deploy and resolve URLs
description: >-
  Run tailor deploy and show for a given workspace.
  Internal action using the deploy script shared by deploy and preview-deploy.
  Requires TAILOR_RUN to be set (by sdk-setup) before this action runs.

inputs:
  workspace-id:
    description: Tailor Platform workspace ID to deploy to
    required: true
  working-directory:
    description: Working directory for the project (for monorepo setups)
    required: false
    default: "."

outputs:
  app-url:
    description: Application URL (GraphQL endpoint) of the deployed workspace
    value: ${{ steps.deploy.outputs.app-url }}
  frontend-urls:
    description: JSON object mapping frontendPlugin site names to published URLs; {} when none were deployed
    value: ${{ steps.deploy.outputs.frontend-urls }}

runs:
  using: composite
  steps:
    - name: Deploy and resolve URLs
      id: deploy
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TAILOR_PLATFORM_WORKSPACE_ID: ${{ inputs.workspace-id }}
        DEPLOY_SCRIPT: ${{ github.action_path }}/deploy.sh
      run: bash "$DEPLOY_SCRIPT"
