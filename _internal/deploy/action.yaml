name: Deploy and resolve app URL
description: >-
  Run tailor deploy and show for a given workspace.
  Internal action shared by deploy and preview-deploy.
  Requires TAILOR_RUN to be set (by sdk-setup) before this action runs.

inputs:
  workspace-id:
    description: Tailor Platform workspace ID to deploy to
    required: true
  working-directory:
    description: Working directory for the project (for monorepo setups)
    required: false
    default: "."

outputs:
  result:
    description: The `tailor deploy --json` result as one line of JSON, exactly as the SDK printed it
    value: ${{ steps.deploy.outputs.result }}
  app-url:
    description: Application URL (GraphQL endpoint) of the deployed workspace
    value: ${{ steps.show.outputs.app-url }}
  frontend-urls:
    description: JSON object mapping all static website names in the workspace to URLs; {} when none exist
    value: ${{ steps.frontends.outputs.frontend-urls }}

runs:
  using: composite
  steps:
    - name: Deploy
      id: deploy
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TAILOR_PLATFORM_WORKSPACE_ID: ${{ inputs.workspace-id }}
      run: |
        OUTPUT=$($TAILOR_RUN tailor deploy --yes --json)
        RESULT=$(printf '%s\n' "$OUTPUT" | awk 'NF { line = $0 } END { print line }')
        if printf '%s' "$RESULT" | jq -es 'length == 1 and (.[0] | type) == "object"' > /dev/null 2>&1; then
          printf 'result=%s\n' "$RESULT" >> "$GITHUB_OUTPUT"
        fi

    - name: Resolve app URL
      id: show
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TAILOR_PLATFORM_WORKSPACE_ID: ${{ inputs.workspace-id }}
      run: |
        if APP_JSON=$($TAILOR_RUN tailor show --json 2>/dev/null); then
          APP_URL=$(echo "$APP_JSON" | jq -r '.url // ""')
        else
          APP_URL=""
        fi
        echo "app-url=$APP_URL" >> "$GITHUB_OUTPUT"

    - name: Resolve frontend URLs
      id: frontends
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TAILOR_PLATFORM_WORKSPACE_ID: ${{ inputs.workspace-id }}
      run: |
        WEBSITES=$($TAILOR_RUN tailor staticwebsite list --json)
        FRONTEND_URLS=$(printf '%s\n' "$WEBSITES" | jq -ce 'map({key: .name, value: .url}) | from_entries')
        printf 'frontend-urls=%s\n' "$FRONTEND_URLS" >> "$GITHUB_OUTPUT"
