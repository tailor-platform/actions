name: Post ERD preview links as a PR comment
description: >-
  Post a PR comment linking to ERD viewer artifacts. When links is an empty
  array, the comment says no relevant ERD changes are in this update instead
  of being left empty. Earlier ERD comments are hidden as outdated, or with
  sticky set to "true" the newest one is updated in place.

inputs:
  links:
    description: >-
      JSON array of `{"label": string, "url": string}` objects to render
      as a bullet list. An empty array (`[]`) posts a "no relevant
      changes" status instead.
    required: true
  base-ref:
    description: >-
      Base branch name to mention in the comment (e.g. "the diff is
      against main"). Omit to skip that phrase.
    required: false
    default: ""
  github-token:
    description: GitHub token with pull-requests:write permission
    required: true
  sticky:
    description: >-
      Set to "true" to update the newest ERD comment in place. Otherwise
      earlier ERD comments are hidden as outdated and a new one is posted.
    required: false
    default: "false"
  pr-number:
    description: Pull request number. Defaults to the current PR number.
    required: false
    default: ""

outputs:
  comment-id:
    description: ID of the created or updated comment
    value: ${{ steps.post.outputs.comment-id }}

runs:
  using: composite
  steps:
    - name: Build comment body
      id: build
      shell: bash
      env:
        LINKS: ${{ inputs.links }}
        BASE_REF: ${{ inputs.base-ref }}
        SERVER_URL: ${{ github.server_url }}
      run: |
        MARKER="<!-- tailor-erd-preview -->"

        if ! printf '%s' "$LINKS" | jq -e 'type == "array"' >/dev/null; then
          echo "::error::links must be a JSON array"
          exit 1
        fi

        if ! printf '%s' "$LINKS" | jq -e \
          '[.[] | (type == "object") and ((.label | type) == "string") and ((.label | length) > 0) and ((.url | type) == "string") and ((.url | length) > 0)] | all' \
          >/dev/null; then
          echo "::error::each links entry must be an object with non-empty string label and url fields"
          exit 1
        fi

        LINKS_COUNT=$(printf '%s' "$LINKS" | jq 'length')
        if [ "$LINKS_COUNT" -eq 0 ]; then
          BODY="${MARKER}"$'\n'"## 🗺️ ERD preview"$'\n\n'"No relevant ERD changes in this update."
        else
          DIFF_NOTE=""
          [ -n "$BASE_REF" ] && DIFF_NOTE=" Each viewer can switch between the current schema and a diff against base branch \`$BASE_REF\`."
          GHES=$(bash "${{ github.action_path }}/../lib/is-ghes.sh" "$SERVER_URL")
          if [ "$GHES" = "false" ]; then
            LIST=$(printf '%s' "$LINKS" | jq -r '.[] | "- **\(.label)**: [view](\(.url))"')
            DESCRIPTION="Self-contained ERD viewer HTML built for this run."
          else
            LIST=$(printf '%s' "$LINKS" | jq -r '.[] | "- **\(.label)**: [run](\(.url))"')
            DESCRIPTION="These are candidate ERD viewer artifact names; irrelevant namespaces produce no artifact. After the run completes, download the ZIP from the run page, extract it, and open the HTML locally."
          fi
          BODY="${MARKER}"$'\n'"## 🗺️ ERD preview"$'\n\n'"${DESCRIPTION}${DIFF_NOTE}"$'\n'"${LIST}"
        fi

        EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
        {
          echo "body<<$EOF"
          echo "$BODY"
          echo "$EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Post comment
      id: post
      uses: tailor-platform/actions/_internal/sticky-comment@9dde14278f825531bc127c065f5666d2967ab0a7
      with:
        marker-prefix: "<!-- tailor-erd-preview -->"
        body: ${{ steps.build.outputs.body }}
        github-token: ${{ inputs.github-token }}
        sticky: ${{ inputs.sticky }}
        pr-number: ${{ inputs.pr-number }}
