name: Set up Tailor SDK
description: >-
  Mask credentials, resolve the tailor-sdk runner (writes TAILOR_SDK_RUN to env),
  and log in to Tailor Platform. Internal action — use via deploy, plan, or preview actions.

inputs:
  platform-client-id:
    description: OAuth2 client ID for Tailor Platform machine user
    # PAT fallback: optional when platform-token is provided instead
    required: false
    default: ""
  platform-client-secret:
    description: OAuth2 client secret for Tailor Platform machine user
    # PAT fallback: optional when platform-token is provided instead
    required: false
    default: ""
  # PAT fallback: set TAILOR_PLATFORM_TOKEN directly instead of using machine user OAuth2.
  # Use when a Proxy-Free Machine User (PFMU) is not available (e.g. during initial setup
  # or testing). Exactly one of (platform-client-id + platform-client-secret) or
  # platform-token must be provided.
  platform-token:
    description: >-
      Tailor Platform personal access token.
      Alternative to platform-client-id + platform-client-secret when a
      Proxy-Free Machine User (PFMU) is not available.
    required: false
    default: ""
  package-manager:
    description: Package manager used to run tailor-sdk (pnpm, npm, yarn, or bun). Defaults to npx when empty.
    required: false
    default: ""
  working-directory:
    description: Working directory for the project (for monorepo setups)
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Validate credential inputs
      shell: bash
      env:
        CLIENT_ID: ${{ inputs.platform-client-id }}
        PLATFORM_TOKEN: ${{ inputs.platform-token }}
      run: |
        if [ -z "$CLIENT_ID" ] && [ -z "$PLATFORM_TOKEN" ]; then
          echo "::error::Either platform-client-id + platform-client-secret or platform-token must be provided."
          exit 1
        fi

    - name: Mask credentials
      shell: bash
      env:
        CLIENT_ID: ${{ inputs.platform-client-id }}
        CLIENT_SECRET: ${{ inputs.platform-client-secret }}
        # PAT fallback: mask the personal access token if provided
        PLATFORM_TOKEN: ${{ inputs.platform-token }}
      run: |
        [ -n "$CLIENT_ID" ] && echo "::add-mask::$CLIENT_ID" || true
        [ -n "$CLIENT_SECRET" ] && echo "::add-mask::$CLIENT_SECRET" || true
        [ -n "$PLATFORM_TOKEN" ] && echo "::add-mask::$PLATFORM_TOKEN" || true

    - name: Resolve tailor-sdk runner
      shell: bash
      env:
        PACKAGE_MANAGER: ${{ inputs.package-manager }}
      # RUN is one of a fixed set of literals chosen by the case below (never
      # user input), so writing it to GITHUB_ENV cannot inject code.
      run: | # zizmor: ignore[github-env]
        case "$PACKAGE_MANAGER" in
          pnpm) RUN="pnpm exec" ;;
          yarn) RUN="yarn" ;;
          bun)  RUN="bunx" ;;
          npm|"") RUN="npx" ;;
          *)
            echo "::error::Unsupported package-manager '$PACKAGE_MANAGER' (expected pnpm, npm, yarn, or bun)"
            exit 1
            ;;
        esac
        echo "TAILOR_SDK_RUN=$RUN" >> "$GITHUB_ENV"

    # PAT fallback: set TAILOR_PLATFORM_TOKEN directly; tailor-sdk reads it with
    # highest priority so the login step below is skipped in this path.
    - name: Set platform token (PAT fallback)
      if: inputs.platform-token != ''
      shell: bash
      env:
        PLATFORM_TOKEN: ${{ inputs.platform-token }}
      run: | # zizmor: ignore[github-env]
        echo "TAILOR_PLATFORM_TOKEN=$PLATFORM_TOKEN" >> "$GITHUB_ENV"

    - name: Login to Tailor Platform
      # PAT fallback: skip machine user login when a personal access token is used.
      if: inputs.platform-client-id != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TAILOR_PLATFORM_MACHINE_USER_CLIENT_ID: ${{ inputs.platform-client-id }}
        TAILOR_PLATFORM_MACHINE_USER_CLIENT_SECRET: ${{ inputs.platform-client-secret }}
      run: $TAILOR_SDK_RUN tailor-sdk login --machineuser
