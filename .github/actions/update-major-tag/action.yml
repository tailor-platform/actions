name: Update major version tag
description: Force-updates the major version tag (e.g. v2) to point at the given release tag.

inputs:
  release-tag:
    description: The release tag to derive the major version prefix from (vX.Y.Z)
    required: true
  ref:
    description: Git ref/commit the major tag should point to
    required: true
  github-token:
    description: Token used to push the updated tag
    required: true

runs:
  using: composite
  steps:
    - name: Update major version tag
      shell: bash
      env:
        RELEASE_TAG: ${{ inputs.release-tag }}
        REF: ${{ inputs.ref }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail

        if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::Tag '$RELEASE_TAG' is not a valid semver tag (expected vX.Y.Z)"
          exit 1
        fi

        MAJOR=$(echo "$RELEASE_TAG" | grep -o '^v[0-9]*')
        echo "Updating $MAJOR to point to $REF ($RELEASE_TAG)"

        git tag -f "$MAJOR" "$REF"
        git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$MAJOR"
