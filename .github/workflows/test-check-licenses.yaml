name: Test Check-Licenses Action

on:
  pull_request:
    paths:
      - "check-licenses/**"
      - "tests/check-licenses/**"
      - ".github/workflows/test-check-licenses.yaml"
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Run unit tests
        run: node --test check-licenses/*.test.mjs

  test-pass:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.22.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: tests/check-licenses/pass/pnpm-lock.yaml

      - name: Install fake dependencies
        working-directory: tests/check-licenses/pass
        run: pnpm install

      - name: "Test: allowed license passes"
        uses: ./check-licenses
        with:
          working-directory: tests/check-licenses/pass

  test-fail:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.22.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: tests/check-licenses/fail/pnpm-lock.yaml

      - name: Install fake dependencies
        working-directory: tests/check-licenses/fail
        run: pnpm install

      - name: "Test: disallowed license fails"
        id: check
        continue-on-error: true
        uses: ./check-licenses
        with:
          working-directory: tests/check-licenses/fail

      - name: "Verify: outcome must be failure"
        env:
          OUTCOME: ${{ steps.check.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::Expected check-licenses to fail on a disallowed license"
            exit 1
          fi

  test-additional-licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.22.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: tests/check-licenses/fail/pnpm-lock.yaml

      - name: Install fake dependencies
        working-directory: tests/check-licenses/fail
        run: pnpm install

      - name: "Test: additional-licenses allows an otherwise-disallowed license"
        uses: ./check-licenses
        with:
          working-directory: tests/check-licenses/fail
          additional-licenses: GPL-3.0

  test-denied-licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.22.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: tests/check-licenses/pass/pnpm-lock.yaml

      - name: Install fake dependencies
        working-directory: tests/check-licenses/pass
        run: pnpm install

      - name: "Test: denied-licenses rejects an otherwise-allowed license"
        id: check
        continue-on-error: true
        uses: ./check-licenses
        with:
          working-directory: tests/check-licenses/pass
          denied-licenses: MIT

      - name: "Verify: outcome must be failure"
        env:
          OUTCOME: ${{ steps.check.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::Expected check-licenses to fail when the only license is denied"
            exit 1
          fi

  test-license-groups:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.22.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: tests/check-licenses/pass/pnpm-lock.yaml

      - name: Install fake dependencies
        working-directory: tests/check-licenses/pass
        run: pnpm install

      - name: "Test: excluding MIT's group (notice) via license-groups fails"
        id: check
        continue-on-error: true
        uses: ./check-licenses
        with:
          working-directory: tests/check-licenses/pass
          license-groups: "reciprocal,unencumbered"

      - name: "Verify: outcome must be failure"
        env:
          OUTCOME: ${{ steps.check.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::Expected check-licenses to fail when license-groups excludes MIT's group"
            exit 1
          fi

      - name: "Test: an unknown license-groups value fails with a clear error"
        id: check-invalid
        continue-on-error: true
        uses: ./check-licenses
        with:
          working-directory: tests/check-licenses/pass
          license-groups: "bogus"

      - name: "Verify: outcome must be failure"
        env:
          OUTCOME: ${{ steps.check-invalid.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::Expected check-licenses to fail on an unknown license-groups value"
            exit 1
          fi

  test-package-exceptions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.22.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: tests/check-licenses/chain/pnpm-lock.yaml

      - name: Install fake dependencies
        working-directory: tests/check-licenses/chain
        run: pnpm install

      - name: "Test: chain matches app-a -> mid-pkg -> gpl-leaf"
        uses: ./check-licenses
        with:
          working-directory: tests/check-licenses/chain
          package-exceptions: '{"GPL-3.0": [["app-a", "mid-pkg"]]}'

      - name: "Test: chain matches with a glob on the violating package itself"
        uses: ./check-licenses
        with:
          working-directory: tests/check-licenses/chain
          package-exceptions: '{"GPL-3.0": [["app-a", "gpl-*"]]}'

      - name: "Test: chain matches skipping the intermediate package (gaps allowed)"
        uses: ./check-licenses
        with:
          working-directory: tests/check-licenses/chain
          package-exceptions: '{"GPL-3.0": [["app-a", "gpl-leaf"]]}'

      - name: "Test: wrong workspace project name does not match"
        id: check-wrong-project
        continue-on-error: true
        uses: ./check-licenses
        with:
          working-directory: tests/check-licenses/chain
          package-exceptions: '{"GPL-3.0": [["app-b", "mid-pkg"]]}'

      - name: "Verify: outcome must be failure"
        env:
          OUTCOME: ${{ steps.check-wrong-project.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::Expected check-licenses to fail when the chain's workspace project doesn't match"
            exit 1
          fi

      - name: "Test: reversed chain order does not match"
        id: check-wrong-order
        continue-on-error: true
        uses: ./check-licenses
        with:
          working-directory: tests/check-licenses/chain
          package-exceptions: '{"GPL-3.0": [["mid-pkg", "app-a"]]}'

      - name: "Verify: outcome must be failure"
        env:
          OUTCOME: ${{ steps.check-wrong-order.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::Expected check-licenses to fail when the chain order is reversed"
            exit 1
          fi

      - name: "Test: chain for a different license does not match"
        id: check-wrong-license
        continue-on-error: true
        uses: ./check-licenses
        with:
          working-directory: tests/check-licenses/chain
          package-exceptions: '{"MPL-2.0": [["app-a", "mid-pkg"]]}'

      - name: "Verify: outcome must be failure"
        env:
          OUTCOME: ${{ steps.check-wrong-license.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::Expected check-licenses to fail when the exception is keyed by the wrong license"
            exit 1
          fi

      - name: "Test: invalid JSON fails with a clear error"
        id: check-invalid-json
        continue-on-error: true
        uses: ./check-licenses
        with:
          working-directory: tests/check-licenses/chain
          package-exceptions: "not valid json"

      - name: "Verify: outcome must be failure"
        env:
          OUTCOME: ${{ steps.check-invalid-json.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::Expected check-licenses to fail on invalid package-exceptions JSON"
            exit 1
          fi

  test-package-exceptions-multi-path:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.22.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: tests/check-licenses/chain-multi-path/pnpm-lock.yaml

      - name: Install fake dependencies
        working-directory: tests/check-licenses/chain-multi-path
        run: pnpm install

      # gpl-leaf is reachable two ways here: app-a -> mid-pkg -> gpl-leaf,
      # and app-b -> gpl-leaf directly. Approving only one route must not
      # excuse the other, unreviewed one.
      - name: "Test: approving only one of two routes still fails"
        id: check-partial
        continue-on-error: true
        uses: ./check-licenses
        with:
          working-directory: tests/check-licenses/chain-multi-path
          package-exceptions: '{"GPL-3.0": [["app-a", "mid-pkg"]]}'

      - name: "Verify: outcome must be failure"
        env:
          OUTCOME: ${{ steps.check-partial.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::Expected check-licenses to fail when only one of two routes is approved"
            exit 1
          fi

      - name: "Test: approving every route passes"
        uses: ./check-licenses
        with:
          working-directory: tests/check-licenses/chain-multi-path
          package-exceptions: '{"GPL-3.0": [["app-a", "mid-pkg"], ["app-b", "gpl-leaf"]]}'
