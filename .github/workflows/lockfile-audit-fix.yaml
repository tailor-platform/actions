name: Lockfile Audit Auto-fix

# Daily pnpm audit --fix for the root and tests/deploy lockfiles, opened as a
# PR via create-signed-pr. Complements lockfile-audit.yaml's PR/push gate by
# clearing pre-existing advisories on a schedule instead of blocking reviews.
#
# Uses GITHUB_TOKEN, so a PR opened here suppresses every pull_request-triggered
# workflow, not just test-deploy.yaml — ci.yaml and lockfile-audit.yaml itself
# also won't run (GitHub suppresses recursive runs from its own token). The
# lockfile-audit-fix action already verifies the fix installs before this PR
# is opened, but re-request checks (or push an empty commit) before merging
# to get the rest of the repo's normal validation.
# No workflow_dispatch: GitHub evaluates a dispatched run's own branch's copy
# of this file, so an in-file `if:` guard can't stop a branch that already
# removed it — schedule is the only trigger, and GitHub always runs a
# scheduled workflow from the default branch.
on:
  schedule:
    - cron: "0 3 * * *" # daily, 03:00 UTC

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  audit-fix:
    name: Audit and fix lockfile (${{ matrix.working-directory }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - working-directory: "."
            prefix: ""
            branch: chore/lockfile-audit-fix
          - working-directory: "tests/deploy"
            prefix: "tests/deploy/"
            branch: chore/lockfile-audit-fix-tests-deploy

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.27.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0

      - name: Audit and fix lockfile
        id: audit_fix
        uses: $/lockfile-audit-fix
        with:
          working-directory: ${{ matrix.working-directory }}

      - name: Determine which files to commit
        id: paths
        if: steps.audit_fix.outputs.changed == 'true'
        env:
          PREFIX: ${{ matrix.prefix }}
        run: |
          {
            echo "list<<EOF"
            git status --porcelain -- "${PREFIX}pnpm-lock.yaml" "${PREFIX}pnpm-workspace.yaml" "${PREFIX}package.json" | cut -c4-
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update pull request
        if: steps.audit_fix.outputs.changed == 'true'
        uses: $/create-signed-pr
        with:
          token: ${{ github.token }}
          branch: ${{ matrix.branch }}
          commit-message: "fix(deps): automated lockfile security fix (${{ matrix.working-directory }})"
          title: "fix(deps): automated lockfile security fix (${{ matrix.working-directory }})"
          body: ${{ steps.audit_fix.outputs.summary }}
          paths: ${{ steps.paths.outputs.list }}
          labels: security
