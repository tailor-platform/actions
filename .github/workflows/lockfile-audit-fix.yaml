name: Lockfile Audit Auto-fix

# Daily pnpm audit --fix for the root and tests/deploy lockfiles, opened as a
# single PR via create-signed-pr. Complements lockfile-audit.yaml's PR/push gate by
# clearing pre-existing advisories on a schedule instead of blocking reviews.
#
# Uses GITHUB_TOKEN, so a PR opened here suppresses every pull_request-triggered
# workflow, not just test-deploy.yaml — ci.yaml and lockfile-audit.yaml itself
# also won't run (GitHub suppresses recursive runs from its own token). The
# lockfile-audit-fix action already verifies the fix installs before this PR
# is opened, but re-request checks (or push an empty commit) before merging
# to get the rest of the repo's normal validation.
# No workflow_dispatch: GitHub evaluates a dispatched run's own branch's copy
# of this file, so an in-file `if:` guard can't stop a branch that already
# removed it — schedule is the only trigger, and GitHub always runs a
# scheduled workflow from the default branch.
on:
  schedule:
    - cron: "0 3 * * *" # daily, 03:00 UTC

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  audit-fix:
    name: Audit and fix lockfiles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.8.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0

      - name: Audit and fix lockfile (.)
        id: audit_root
        uses: $/lockfile-audit-fix
        with:
          working-directory: "."

      # !cancelled() rather than continue-on-error: a failure in one directory
      # should still let the other be fixed, but must keep the job red.
      - name: Audit and fix lockfile (tests/deploy)
        id: audit_deploy
        if: ${{ !cancelled() }}
        uses: $/lockfile-audit-fix
        with:
          working-directory: "tests/deploy"

      - name: Determine which files to commit
        id: paths
        if: ${{ !cancelled() && (steps.audit_root.outputs.changed == 'true' || steps.audit_deploy.outputs.changed == 'true') }}
        run: |
          {
            echo "list<<EOF"
            git status --porcelain -- pnpm-lock.yaml pnpm-workspace.yaml package.json tests/deploy/pnpm-lock.yaml tests/deploy/pnpm-workspace.yaml tests/deploy/package.json | cut -c4-
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build pull request body
        id: body
        if: ${{ !cancelled() && steps.paths.outputs.list != '' }}
        env:
          ROOT_CHANGED: ${{ steps.audit_root.outputs.changed }}
          ROOT_SUMMARY: ${{ steps.audit_root.outputs.summary }}
          DEPLOY_CHANGED: ${{ steps.audit_deploy.outputs.changed }}
          DEPLOY_SUMMARY: ${{ steps.audit_deploy.outputs.summary }}
        run: |
          header='Automated fix from `pnpm audit --fix`.'
          delimiter="EOF_$(openssl rand -hex 16)"
          {
            echo "text<<${delimiter}"
            echo "$header"
            if [ "$ROOT_CHANGED" = "true" ]; then printf '\n### `.`%s\n' "${ROOT_SUMMARY#"$header"}"; fi
            if [ "$DEPLOY_CHANGED" = "true" ]; then printf '\n### `tests/deploy`%s\n' "${DEPLOY_SUMMARY#"$header"}"; fi
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update pull request
        if: ${{ !cancelled() && steps.paths.outputs.list != '' }}
        uses: $/create-signed-pr
        with:
          token: ${{ github.token }}
          branch: chore/lockfile-audit-fix
          commit-message: "fix(deps): automated lockfile security fix"
          title: "fix(deps): automated lockfile security fix"
          body: ${{ steps.body.outputs.text }}
          paths: ${{ steps.paths.outputs.list }}
          labels: security
