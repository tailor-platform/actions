name: Lockfile Audit Auto-fix

# Runs the full lockfile audit daily for both real (non-fixture) lockfiles
# in this repo — root tooling deps and the deploy action's test fixture —
# independent of any specific PR, and opens (or updates) a pull request per
# lockfile with whatever pnpm can automatically resolve. This complements
# lockfile-audit.yaml's regression-only gate: pre-existing advisories that
# predate a given PR are cleared here on a schedule instead of blocking
# unrelated reviews.
#
# The audit, fix, verification, and pnpm-workspace.yaml policy pruning are
# all delegated to the lockfile-audit-fix action; this workflow only turns
# its outputs into a pull request. Uses the default GITHUB_TOKEN (no GitHub
# App) — the tradeoff is that a PR opened this way does not trigger its own
# pull_request-triggered CI (e.g. test-deploy.yaml), since GitHub suppresses
# recursive runs from its own token. Reviewers should re-request checks (or
# push an empty commit) before merging a tests/deploy PR from this workflow;
# the push-to-main trigger on the affected workflow is the actual safety net
# once merged.
#
# No changeset is added: this repo's Renovate lock-file-maintenance PRs for
# the root lockfile also ship without one, and tests/deploy is a test
# fixture with no effect on any published package version.
on:
  schedule:
    - cron: "0 3 * * *" # daily, 03:00 UTC
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  audit-fix:
    name: Audit and fix lockfile (${{ matrix.working-directory }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - working-directory: "."
            prefix: ""
            branch: chore/lockfile-audit-fix
          - working-directory: "tests/deploy"
            prefix: "tests/deploy/"
            branch: chore/lockfile-audit-fix-tests-deploy

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.26.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0

      - name: Audit and fix lockfile
        id: audit_fix
        uses: $/lockfile-audit-fix
        with:
          working-directory: ${{ matrix.working-directory }}

      - name: Determine which files to commit
        id: paths
        if: steps.audit_fix.outputs.changed == 'true'
        working-directory: ${{ matrix.working-directory }}
        env:
          PREFIX: ${{ matrix.prefix }}
        run: |
          {
            echo "list<<EOF"
            for f in pnpm-lock.yaml pnpm-workspace.yaml package.json; do
              [ -f "$f" ] && echo "${PREFIX}${f}"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update pull request
        if: steps.audit_fix.outputs.changed == 'true'
        uses: $/create-signed-pr
        with:
          token: ${{ github.token }}
          branch: ${{ matrix.branch }}
          commit-message: "fix(deps): automated lockfile security fix (${{ matrix.working-directory }})"
          title: "fix(deps): automated lockfile security fix (${{ matrix.working-directory }})"
          body: ${{ steps.audit_fix.outputs.summary }}
          paths: ${{ steps.paths.outputs.list }}
          labels: security
