name: Test ERD Comment Action

on:
  pull_request:
    paths:
      - "_internal/erd-comment/**"
      - "_internal/lib/**"
      - ".github/workflows/test-erd-comment.yaml"
  workflow_dispatch:
    inputs:
      pr-number:
        description: PR number to post test comments on
        required: true
        type: number

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Test: posts links when links is non-empty"
        id: post
        uses: $/_internal/erd-comment
        with:
          links: '[{"label": "tailordb", "url": "https://example.com/tailordb.html"}]'
          base-ref: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.pull_request.number || inputs.pr-number }}

      - name: "Verify: comment-id is set"
        env:
          COMMENT_ID: ${{ steps.post.outputs.comment-id }}
        run: |
          if [ -z "$COMMENT_ID" ]; then
            echo "::error::comment-id should be set after posting"
            exit 1
          fi

      - name: "Verify: comment body contains the link"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_ID: ${{ steps.post.outputs.comment-id }}
        run: |
          BODY=$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq .body)
          case "$BODY" in
            *"tailordb"*"https://example.com/tailordb.html"*) ;;
            *) echo "::error::Expected comment body to contain the tailordb link"; exit 1 ;;
          esac

      - name: "Test: posts a no-changes status when links is empty"
        id: update
        uses: $/_internal/erd-comment
        with:
          links: "[]"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.pull_request.number || inputs.pr-number }}

      - name: "Verify: a new comment is posted, the earlier one is hidden, and the no-changes text is present"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POST_ID: ${{ steps.post.outputs.comment-id }}
          UPDATE_ID: ${{ steps.update.outputs.comment-id }}
        run: |
          if [ -z "$UPDATE_ID" ] || [ "$POST_ID" = "$UPDATE_ID" ]; then
            echo "::error::Expected a new comment-id for the no-changes status"
            echo "  post:   $POST_ID"
            echo "  update: $UPDATE_ID"
            exit 1
          fi
          minimized() {
            gh api "repos/$GITHUB_REPOSITORY/issues/comments/$1" --jq .node_id |
              xargs -I{} gh api graphql -f query='query($id: ID!) { node(id: $id) { ... on IssueComment { isMinimized } } }' -f id={} --jq .data.node.isMinimized
          }
          if [ "$(minimized "$POST_ID")" != "true" ]; then
            echo "::error::The earlier comment $POST_ID should be hidden"
            exit 1
          fi
          if [ "$(minimized "$UPDATE_ID")" != "false" ]; then
            echo "::error::The new comment $UPDATE_ID should not be hidden"
            exit 1
          fi
          BODY=$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$UPDATE_ID" --jq .body)
          case "$BODY" in
            *"No relevant ERD changes"*) ;;
            *) echo "::error::Expected the no-changes status text"; exit 1 ;;
          esac

      - name: Remove the comments of the default mode
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_IDS: ${{ steps.post.outputs.comment-id }} ${{ steps.update.outputs.comment-id }}
        run: |
          for id in $COMMENT_IDS; do
            gh api "repos/$GITHUB_REPOSITORY/issues/comments/$id" -X DELETE
          done

      - name: "Test: posts links (sticky)"
        id: sticky-post
        uses: $/_internal/erd-comment
        with:
          links: '[{"label": "tailordb", "url": "https://example.com/tailordb.html"}]'
          base-ref: main
          sticky: "true"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.pull_request.number || inputs.pr-number }}

      - name: "Test: updates to a no-changes status when links is empty (sticky)"
        id: sticky-update
        uses: $/_internal/erd-comment
        with:
          links: "[]"
          sticky: "true"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.pull_request.number || inputs.pr-number }}

      - name: "Verify: sticky keeps the same comment-id and shows the no-changes text"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POST_ID: ${{ steps.sticky-post.outputs.comment-id }}
          UPDATE_ID: ${{ steps.sticky-update.outputs.comment-id }}
        run: |
          if [ -z "$POST_ID" ] || [ "$POST_ID" != "$UPDATE_ID" ]; then
            echo "::error::Expected the same comment-id when sticky updates the status"
            echo "  post:   $POST_ID"
            echo "  update: $UPDATE_ID"
            exit 1
          fi
          BODY=$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$UPDATE_ID" --jq .body)
          case "$BODY" in
            *"No relevant ERD changes"*) ;;
            *) echo "::error::Expected the no-changes status text"; exit 1 ;;
          esac

      - name: Cleanup — delete test comments
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_IDS: ${{ steps.post.outputs.comment-id }} ${{ steps.update.outputs.comment-id }} ${{ steps.sticky-post.outputs.comment-id }}
        run: |
          for id in $COMMENT_IDS; do
            gh api "repos/$GITHUB_REPOSITORY/issues/comments/$id" -X DELETE || true
          done
