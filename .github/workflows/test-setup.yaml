name: Test Setup Action

on:
  pull_request:
    paths:
      - "setup/**"
      - "install/**"
      - ".github/workflows/test-setup.yaml"
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  test-bun:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: "Test: sets up Bun"
        uses: $/setup
        with:
          package-manager: bun

      - name: "Verify: bun is on PATH"
        run: bun --version

  test-yarn:
    name: test-yarn (${{ matrix.name }})
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Yarn 4 on Node.js 26
            manifest: '{"packageManager":"yarn@4.19.0","engines":{"node":"26"}}'
            lockfile: berry
            yarn-version: 4.19.0
          - name: Yarn 4 on Node.js 24
            manifest: '{"packageManager":"yarn@4.19.0","engines":{"node":"24"}}'
            lockfile: berry
            yarn-version: 4.19.0
          - name: Yarn 4 on the runner's Node.js
            manifest: '{"packageManager":"yarn@4.19.0"}'
            lockfile: berry
            yarn-version: 4.19.0
          - name: Yarn 4 from devEngines
            manifest: '{"devEngines":{"packageManager":{"name":"yarn","version":"4.19.0"}},"engines":{"node":"26"}}'
            lockfile: berry
            yarn-version: 4.19.0
          - name: Yarn 4 from yarnPath with packageManager
            manifest: '{"packageManager":"yarn@4.19.0","engines":{"node":"26"}}'
            lockfile: berry
            yarn-path: 4.19.0
            yarn-version: 4.19.0
          - name: Yarn 4 from yarnPath alone
            manifest: '{"engines":{"node":"26"}}'
            lockfile: berry
            yarn-path: 4.19.0
            yarn-version: 4.19.0
          - name: Yarn 1 without packageManager
            manifest: '{"engines":{"node":"26"}}'
            lockfile: classic
            yarn-version: 1.*
          - name: Yarn 4 on Windows
            os: windows-latest
            manifest: '{"packageManager":"yarn@4.19.0","engines":{"node":"26"}}'
            lockfile: berry
            yarn-version: 4.19.0
    steps:
      - name: Write the project
        env:
          MANIFEST: ${{ matrix.manifest }}
          LOCKFILE: ${{ matrix.lockfile }}
          YARN_PATH: ${{ matrix.yarn-path }}
        run: |
          node -e 'require("node:fs").writeFileSync("package.json", JSON.stringify({ name: "fixture", private: true, ...JSON.parse(process.env.MANIFEST) }, null, 2) + "\n")'
          if [ "$LOCKFILE" = berry ]; then
            cat > yarn.lock <<'LOCK'
          # This file is generated by running "yarn install" inside your project.
          # Manual changes might be lost - proceed with caution!

          __metadata:
            version: 10
            cacheKey: 10c0

          "fixture@workspace:.":
            version: 0.0.0-use.local
            resolution: "fixture@workspace:."
            languageName: unknown
            linkType: soft
          LOCK
          else
            printf '# THIS IS AN AUTOGENERATED FILE. DO NOT EDIT THIS FILE DIRECTLY.\n# yarn lockfile v1\n\n\n' > yarn.lock
          fi
          if [ -n "$YARN_PATH" ]; then
            mkdir -p .yarn/releases
            curl -fsSL "https://repo.yarnpkg.com/$YARN_PATH/packages/yarnpkg-cli/bin/yarn.js" -o ".yarn/releases/yarn-$YARN_PATH.cjs"
            echo "yarnPath: .yarn/releases/yarn-$YARN_PATH.cjs" > .yarnrc.yml
          fi

      - name: "Test: sets up Yarn"
        uses: $/setup
        with:
          package-manager: yarn

      - name: "Verify: Corepack provides the declared Yarn version"
        env:
          YARN_VERSION_PATTERN: ${{ matrix.yarn-version }}
        run: |
          case "$RUNNER_OS" in
            Windows) runner_temp="$(cygpath -u "$RUNNER_TEMP")" ;;
            *) runner_temp="$RUNNER_TEMP" ;;
          esac
          test "$(command -v yarn)" = "$runner_temp/tailor-corepack/shims/yarn"
          [[ "$(yarn --version)" == $YARN_VERSION_PATTERN ]]

      - name: "Verify: setup puts no other Corepack binaries on PATH"
        run: |
          for bin in corepack pnpm pnpx; do
            [[ "$(command -v "$bin")" != */tailor-corepack/* ]]
          done

      - name: "Verify: PowerShell and cmd run the declared Yarn version"
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          YARN_VERSION: ${{ matrix.yarn-version }}
        run: |
          foreach ($version in (yarn --version), (cmd /c yarn --version)) {
            if ($version -ne $env:YARN_VERSION) { throw "yarn --version printed $version" }
          }

      - name: "Test: installs with the install action"
        uses: $/install
        with:
          package-manager: yarn
