name: Test Setup Action

on:
  pull_request:
    paths:
      - "setup/**"
      - "tests/deploy/**"
      - ".github/workflows/test-setup.yaml"
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: test-setup-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Run setup action
        uses: ./setup
        with:
          package-manager: pnpm
          node-version-file: tests/deploy/package.json
          working-directory: tests/deploy

      - name: Verify tailor-sdk is runnable
        working-directory: tests/deploy
        run: npx tailor-sdk --version
