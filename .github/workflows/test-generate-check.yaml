name: Test Generate-Check Action

on:
  pull_request:
    paths:
      - "generate-check/**"
      - "tests/generate-check/**"
      - ".github/workflows/test-generate-check.yaml"
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  test-happy-path:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.14.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: tests/generate-check/pnpm-lock.yaml

      - name: Install fake tailor-sdk
        working-directory: tests/generate-check
        run: pnpm install

      - name: "Test: clean generate produces no diff"
        uses: ./generate-check
        with:
          package-manager: pnpm
          working-directory: tests/generate-check

  test-ignore-input:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.14.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: tests/generate-check/pnpm-lock.yaml

      - name: Install fake tailor-sdk
        working-directory: tests/generate-check
        run: pnpm install

      - name: "Test: dirty file listed in ignore does not cause failure"
        uses: ./generate-check
        env:
          FAKE_GENERATE_DIRTY: "1"
        with:
          package-manager: pnpm
          working-directory: tests/generate-check
          ignore: .generated

  test-dirty-generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.14.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: tests/generate-check/pnpm-lock.yaml

      - name: Install fake tailor-sdk
        working-directory: tests/generate-check
        run: pnpm install

      - name: "Test: uncommitted generated file causes failure"
        id: check
        continue-on-error: true
        uses: ./generate-check
        env:
          FAKE_GENERATE_DIRTY: "1"
        with:
          package-manager: pnpm
          working-directory: tests/generate-check

      - name: "Verify: outcome must be failure"
        env:
          OUTCOME: ${{ steps.check.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::Expected generate-check to fail when generated files are dirty"
            exit 1
          fi
