name: Release

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  # Opens/updates the "Version Packages" PR from accumulated changesets — no tag, no
  # release (that's the tag-release job below). Kept in its own concurrency group since
  # concurrent runs would otherwise race to push to the same Version Packages PR
  # branch. GitHub's concurrency queue keeps only the latest pending run per group and
  # cancels older ones, but that's harmless here: a skipped run here just means the PR
  # update is picked up by the next run instead, recomputed from the same
  # currently-accumulated changesets either way.
  changesets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: changesets-${{ github.ref }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.15.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # commit-mode github-api makes the bot's commits (on the Version Packages PR
      # branch) verified/GPG-signed, so they aren't blocked by main's required-signatures
      # rule when that PR is merged (the default git-cli mode pushes unsigned commits).
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          commit-mode: github-api

  # Fires on every push to main, independently of the changesets job above (no `needs`,
  # no shared concurrency group) — unlike a run stuck behind the changesets job's
  # concurrency queue, this one is never cancelled, so a version's release can't be
  # silently skipped just because pushes to main landed close together.
  tag-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Guarded by checking for an existing release with this tag, since a later
      # unrelated push to main with no pending changesets would otherwise try to
      # recreate the same release.
      - name: Tag and create GitHub release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          PENDING=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' 2>/dev/null | head -1)
          if [ -n "$PENDING" ]; then
            echo "Pending changesets exist; nothing to release yet."
            exit 0
          fi

          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"

          EXISTING_COMMIT=$(gh release view "$TAG" --json targetCommitish --jq .targetCommitish 2>/dev/null || true)
          if [ -n "$EXISTING_COMMIT" ]; then
            echo "Release $TAG already exists; nothing to do."
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "commit=$EXISTING_COMMIT" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NOTES=$(awk -v heading="## $VERSION" '
            $0 == heading { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)

          # Target this run's own commit explicitly — it's exactly what introduced this
          # version's CHANGELOG.md section (that's why there are no pending changesets)
          # — rather than defaulting to whatever main's tip resolves to when the API
          # call runs.
          if [ -n "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
            gh release create "$TAG" --title "$TAG" --target "$GITHUB_SHA" --notes "$NOTES"
          else
            echo "::warning::No CHANGELOG.md section found for $VERSION; falling back to --generate-notes."
            gh release create "$TAG" --title "$TAG" --target "$GITHUB_SHA" --generate-notes
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Update major version tag
        if: steps.release.outputs.commit != ''
        uses: ./.github/actions/update-major-tag
        with:
          release-tag: ${{ steps.release.outputs.tag }}
          ref: ${{ steps.release.outputs.commit }}
          github-token: ${{ github.token }}
