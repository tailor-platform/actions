name: Release

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # With pending changesets, opens/updates the "Version Packages" PR that bumps
      # package.json/CHANGELOG.md — no tag, no release yet. With none (that PR having
      # merged), runs `changeset publish` instead: this package is `"private": true`
      # and `.changeset/config.json`'s `privatePackages.tag: true` tells it to skip an
      # actual npm publish but still create the git tag — changesets/action (v2.0.0)
      # detects the "New tag:" line this prints, then pushes that tag itself and
      # creates the GitHub release, generating notes from CHANGELOG.md, the same
      # tested path used for real npm publishes.
      #
      # push-with-git-cli: false (the default) makes the bot's commits (on the Version
      # Packages PR branch, and the tag pushed after `changeset publish`)
      # verified/GPG-signed via the GitHub API, so they aren't blocked by main's
      # required-signatures rule when that PR is merged (setting this to true would
      # push unsigned commits via the git CLI instead). Set explicitly here as
      # documentation of intent, even though it matches the action's default.
      #
      # This action's input and output names went from camelCase (commitMode,
      # publish, publishedPackages) in v1.9.0 to kebab-case (push-with-git-cli,
      # publish-script, published-packages) in v2.0.0 — a breaking rename, not just a
      # docs update. GitHub Actions silently ignores a `with:` key an action doesn't
      # declare, so a stale camelCase key here wouldn't error, it would just no-op
      # (this bit us once during the v1.9.0 -> v2.0.0 upgrade: `publish` being
      # silently dropped meant `changeset publish` never ran, so no tag/release was
      # ever created, with no CI failure to signal it). Always check the input/output
      # names against the actual pinned commit's `action.yml`, not assumptions carried
      # over from a previous version.
      #
      # Deliberately no `concurrency:` group on this job: GitHub's concurrency queue
      # keeps only the latest *pending* run per group and cancels older ones, which
      # would silently skip a version's release if pushes to main landed close
      # together. The (rare) alternative risk of two truly concurrent runs racing to
      # push to the same Version Packages PR branch is self-evident (one push fails
      # loudly) and self-corrects on the next push, rather than silently losing a
      # release.
      - id: changesets
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          push-with-git-cli: false
          publish-script: pnpm exec changeset publish

      # A release created with this job's own GITHUB_TOKEN doesn't fire
      # update-major-tag.yaml's `release: published` trigger, so it can't rely on that
      # separate workflow — update the major tag right here instead.
      # update-major-tag.yaml still exists as a fallback for any release created by
      # other means (e.g. manually via the GitHub UI).
      - name: Update major version tag
        if: steps.changesets.outputs.published == 'true'
        uses: ./.github/actions/update-major-tag
        with:
          release-tag: v${{ fromJson(steps.changesets.outputs['published-packages'])[0].version }}
          ref: ${{ github.sha }}
          github-token: ${{ github.token }}
