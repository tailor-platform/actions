name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.15.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # With no pending changesets, this only opens/updates the "Version Packages" PR
      # (bumping package.json and CHANGELOG.md from accumulated changesets) and does
      # nothing else — no tag, no release. That happens below, once that PR merges.
      # commit-mode github-api makes the bot's commits (on the Version Packages PR
      # branch) verified/GPG-signed, so they aren't blocked by main's required-signatures
      # rule when that PR is merged (the default git-cli mode pushes unsigned commits).
      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          commit-mode: github-api

      # Fires once the Version Packages PR (or any other push to main with no pending
      # changesets) lands. Guarded by checking for an existing release with this tag,
      # since a later unrelated push to main also has hasChangesets == 'false' and
      # would otherwise try to recreate the same release.
      - name: Tag and create GitHub release
        id: release
        if: steps.changesets.outputs.hasChangesets == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"

          EXISTING_COMMIT=$(gh release view "$TAG" --json targetCommitish --jq .targetCommitish 2>/dev/null || true)
          if [ -n "$EXISTING_COMMIT" ]; then
            echo "Release $TAG already exists; nothing to do."
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "commit=$EXISTING_COMMIT" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NOTES=$(awk -v heading="## $VERSION" '
            $0 == heading { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)

          # Target this run's own commit explicitly — it's exactly what introduced this
          # version's CHANGELOG.md section (that's why hasChangesets is false) — rather
          # than defaulting to whatever main's tip resolves to when the API call runs.
          if [ -n "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
            gh release create "$TAG" --title "$TAG" --target "$GITHUB_SHA" --notes "$NOTES"
          else
            echo "::warning::No CHANGELOG.md section found for $VERSION; falling back to --generate-notes."
            gh release create "$TAG" --title "$TAG" --target "$GITHUB_SHA" --generate-notes
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Update major version tag
        if: steps.changesets.outputs.hasChangesets == 'false'
        uses: ./.github/actions/update-major-tag
        with:
          release-tag: ${{ steps.release.outputs.tag }}
          ref: ${{ steps.release.outputs.commit }}
          github-token: ${{ github.token }}
