name: Test Deploy Action

on:
  pull_request:
    paths:
      - "deploy/**"
      - "tests/deploy/**"
      - ".github/workflows/test-deploy.yaml"
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: test-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Secrets are not available for PRs from forks
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.6.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: tests/deploy/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: tests/deploy
        run: pnpm install

      - name: Create test workspace
        id: setup
        working-directory: tests/deploy
        env:
          TAILOR_PLATFORM_MACHINE_USER_CLIENT_ID: ${{ secrets.PLATFORM_MACHINE_USER_CLIENT_ID }}
          TAILOR_PLATFORM_MACHINE_USER_CLIENT_SECRET: ${{ secrets.PLATFORM_MACHINE_USER_CLIENT_SECRET }}
          TAILOR_PLATFORM_ORGANIZATION_ID: ${{ vars.TAILOR_PLATFORM_ORGANIZATION_ID }}
          TAILOR_PLATFORM_FOLDER_ID: ${{ vars.TAILOR_PLATFORM_FOLDER_ID }}
        run: |
          npx tailor-sdk login --machineuser

          CREATE_ARGS=(--name "actions-test-${{ github.run_id }}" --region asia-northeast --organization-id "$TAILOR_PLATFORM_ORGANIZATION_ID")
          if [ -n "$TAILOR_PLATFORM_FOLDER_ID" ]; then
            CREATE_ARGS+=(--folder-id "$TAILOR_PLATFORM_FOLDER_ID")
          fi
          WORKSPACE_ID=$(npx tailor-sdk workspace create -j "${CREATE_ARGS[@]}" | jq -r '.id')
          echo "workspace-id=$WORKSPACE_ID" >> "$GITHUB_OUTPUT"
          echo "Created test workspace: $WORKSPACE_ID"

      - name: Run deploy action
        id: deploy
        uses: ./deploy
        with:
          workspace-id: ${{ steps.setup.outputs.workspace-id }}
          working-directory: tests/deploy
          platform-client-id: ${{ secrets.PLATFORM_MACHINE_USER_CLIENT_ID }}
          platform-client-secret: ${{ secrets.PLATFORM_MACHINE_USER_CLIENT_SECRET }}

      - name: Verify outputs
        env:
          WORKSPACE_ID: ${{ steps.deploy.outputs.workspace-id }}
        run: |
          if [ -z "$WORKSPACE_ID" ]; then
            echo "::error::workspace-id output is empty"
            exit 1
          fi
          echo "Deploy succeeded. workspace-id=$WORKSPACE_ID"

      - name: Cleanup workspace
        if: always() && steps.setup.outputs.workspace-id != ''
        working-directory: tests/deploy
        env:
          WORKSPACE_ID: ${{ steps.setup.outputs.workspace-id }}
        run: npx tailor-sdk workspace delete --workspace-id "$WORKSPACE_ID" --yes
