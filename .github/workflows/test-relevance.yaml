name: Test Relevance Action

on:
  pull_request:
    paths:
      - "relevance/**"
      - ".github/workflows/test-relevance.yaml"
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0

      - name: Run unit tests
        run: node --test relevance/*.test.mjs

  test-zero-sha-is-relevant:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: "Test: all-zero sha-base is always relevant"
        id: relevance
        uses: ./relevance
        with:
          sha-base: "0000000000000000000000000000000000000000"
          sha-head: ${{ github.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Verify: relevant=true and fork-sha is empty"
        env:
          RELEVANT: ${{ steps.relevance.outputs.relevant }}
          FORK_SHA: ${{ steps.relevance.outputs.fork-sha }}
        run: |
          [ "$RELEVANT" = "true" ] || { echo "::error::Expected relevant=true, got '$RELEVANT'"; exit 1; }
          [ -z "$FORK_SHA" ] || { echo "::error::Expected empty fork-sha, got '$FORK_SHA'"; exit 1; }

  test-real-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Resolve parent commit
        id: parent
        run: echo "sha=$(git rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"

      - name: Resolve a path this commit actually touched
        id: touched
        env:
          PARENT_SHA: ${{ steps.parent.outputs.sha }}
        # A hardcoded path (e.g. this workflow file) is only actually touched by
        # the commit that last edited it, not by every commit that triggers this
        # job — asserting relevance against it fails for any other commit/merge.
        # Pick whatever the parent..HEAD diff actually changed instead, so this
        # test is meaningful regardless of which commit triggered the run.
        run: |
          path=$(git diff --name-only "$PARENT_SHA" "$GITHUB_SHA" | head -1)
          if [ -z "$path" ]; then
            echo "::error::$PARENT_SHA..$GITHUB_SHA diff is empty; cannot pick a touched path for this test"
            exit 1
          fi
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: "Test: a path this commit actually touched is relevant"
        id: relevant-path
        uses: ./relevance
        with:
          sha-base: ${{ steps.parent.outputs.sha }}
          sha-head: ${{ github.sha }}
          relevant-paths: |
            ${{ steps.touched.outputs.path }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Verify: relevant=true and fork-sha is the parent commit"
        env:
          RELEVANT: ${{ steps.relevant-path.outputs.relevant }}
          FORK_SHA: ${{ steps.relevant-path.outputs.fork-sha }}
          PARENT_SHA: ${{ steps.parent.outputs.sha }}
        run: |
          [ "$RELEVANT" = "true" ] || { echo "::error::Expected relevant=true, got '$RELEVANT'"; exit 1; }
          [ "$FORK_SHA" = "$PARENT_SHA" ] || { echo "::error::Expected fork-sha='$PARENT_SHA', got '$FORK_SHA'"; exit 1; }

      - name: "Test: a path this commit did not touch is not relevant"
        id: irrelevant-path
        uses: ./relevance
        with:
          sha-base: ${{ steps.parent.outputs.sha }}
          sha-head: ${{ github.sha }}
          relevant-paths: |
            some/path/that/does/not/exist/
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Verify: relevant=false"
        env:
          RELEVANT: ${{ steps.irrelevant-path.outputs.relevant }}
        run: |
          [ "$RELEVANT" = "false" ] || { echo "::error::Expected relevant=false, got '$RELEVANT'"; exit 1; }
