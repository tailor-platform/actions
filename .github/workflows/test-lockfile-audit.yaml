name: Test Lockfile-Audit Action

on:
  pull_request:
    paths:
      - "lockfile-audit/**"
      - "tests/lockfile-audit/**"
      - ".github/workflows/test-lockfile-audit.yaml"
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0

      - name: Run unit tests
        run: node --test lockfile-audit/*.test.mjs

  full-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - fixture: clean
            outcome: success
          - fixture: base
            outcome: failure
          - fixture: new-advisory
            outcome: failure
          - fixture: no-new-advisory
            outcome: failure
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.8.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - name: Generate a fixture lockfile without base history
        env:
          FIXTURE: ${{ matrix.fixture }}
          FIXTURE_DIR: ${{ runner.temp }}/lockfile-audit-${{ matrix.fixture }}
        run: |
          mkdir -p "$FIXTURE_DIR"
          cp "$GITHUB_WORKSPACE/tests/lockfile-audit/$FIXTURE/package.json" "$FIXTURE_DIR/package.json"
          cd "$FIXTURE_DIR"
          pnpm install --lockfile-only --ignore-scripts
      - name: Audit current lockfile
        id: audit
        continue-on-error: true
        uses: $/lockfile-audit
        with:
          working-directory: ${{ runner.temp }}/lockfile-audit-${{ matrix.fixture }}
      - name: Verify audit outcome
        env:
          OUTCOME: ${{ steps.audit.outcome }}
          EXPECTED: ${{ matrix.outcome }}
        run: test "$OUTCOME" = "$EXPECTED"
