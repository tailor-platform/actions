name: Test Lockfile-Audit Action

# Each scenario job builds its own throwaway git repository under
# $RUNNER_TEMP with real base/head commits, rather than checking out this
# repository's own history: the action diffs pnpm-lock.yaml between two
# commits, so exercising it end-to-end needs a repo with exactly the commit
# pair each scenario calls for, not whatever commits happen to exist here.
# Fixture lockfiles are generated fresh via `pnpm install` at test time
# instead of being committed, so they never drift from the pnpm version
# these jobs install.
#
# Fixtures depend on real, still-flagged npm advisories (trim@0.0.1 /
# ansi-html@0.0.1) rather than fabricated ones, since `pnpm audit` resolves
# against the real registry/advisory API — see lockfile-audit/action.yaml's
# description for why no install is otherwise needed.

on:
  pull_request:
    paths:
      - "lockfile-audit/**"
      - "tests/lockfile-audit/**"
      - ".github/workflows/test-lockfile-audit.yaml"
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Run unit tests
        run: node --test lockfile-audit/*.test.mjs

  test-new-advisory-fails:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.25.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Build a fixture repo with a base commit and a head commit that adds a new advisory
        id: fixture
        env:
          FIXTURE_DIR: ${{ runner.temp }}/lockfile-audit-new-advisory
        run: |
          mkdir -p "$FIXTURE_DIR"
          cd "$FIXTURE_DIR"
          git init -q
          git config user.email test@example.com
          git config user.name test

          cp "$GITHUB_WORKSPACE/tests/lockfile-audit/base/package.json" .
          pnpm install --no-frozen-lockfile
          git add -A
          git commit -q -m base
          echo "base-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "fixture-dir=$FIXTURE_DIR" >> "$GITHUB_OUTPUT"

          cp "$GITHUB_WORKSPACE/tests/lockfile-audit/new-advisory/package.json" .
          pnpm install --no-frozen-lockfile
          git add -A
          git commit -q -m head

      - name: "Test: a newly introduced advisory fails"
        id: audit
        continue-on-error: true
        uses: ./lockfile-audit
        with:
          working-directory: ${{ steps.fixture.outputs.fixture-dir }}
          base-sha: ${{ steps.fixture.outputs.base-sha }}

      - name: "Verify: outcome must be failure"
        env:
          OUTCOME: ${{ steps.audit.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::Expected lockfile-audit to fail when the head commit introduces a new advisory"
            exit 1
          fi

  test-no-new-advisory-passes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.25.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Build a fixture repo with a base commit and a head commit that carries the same pre-existing advisory forward
        id: fixture
        env:
          FIXTURE_DIR: ${{ runner.temp }}/lockfile-audit-no-new-advisory
        run: |
          mkdir -p "$FIXTURE_DIR"
          cd "$FIXTURE_DIR"
          git init -q
          git config user.email test@example.com
          git config user.name test

          cp "$GITHUB_WORKSPACE/tests/lockfile-audit/base/package.json" .
          pnpm install --no-frozen-lockfile
          git add -A
          git commit -q -m base
          echo "base-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "fixture-dir=$FIXTURE_DIR" >> "$GITHUB_OUTPUT"

          cp "$GITHUB_WORKSPACE/tests/lockfile-audit/no-new-advisory/package.json" .
          pnpm install --no-frozen-lockfile
          git add -A
          git commit -q -m head

      - name: "Test: a lockfile change with only the pre-existing advisory passes"
        uses: ./lockfile-audit
        with:
          working-directory: ${{ steps.fixture.outputs.fixture-dir }}
          base-sha: ${{ steps.fixture.outputs.base-sha }}

  # There are two distinct "no usable base" cases, and only one is
  # deterministically reproducible here:
  #   1. No base sha resolves at all (resolveBaseSha returns null — e.g. a
  #      workflow_dispatch run, where github.event.before doesn't exist).
  #      This is a legitimate skip, and is covered by resolveBaseSha's own
  #      unit tests plus main()'s single early-exit branch on a null result
  #      — there's no reliable way to force this end-to-end here, since this
  #      workflow's own triggering event (pull_request/push) always supplies
  #      a real, truthy base sha from the OUTER repository's context, and a
  #      `with:` override can't suppress that (an empty base-sha input falls
  #      straight through to the same event-derived resolution).
  #   2. A base sha resolves to something real but unreachable in the target
  #      checkout (e.g. the caller forgot fetch-depth: 0). This is the
  #      deterministic, trigger-independent case below — and incidentally
  #      the exact scenario a pull_request-triggered run of this workflow
  #      exercises implicitly, since the outer PR's own base commit can
  #      never exist inside a fixture repo built from scratch.
  test-unreachable-base-sha-fails:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.25.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Build a fixture repo with only one commit
        id: fixture
        env:
          FIXTURE_DIR: ${{ runner.temp }}/lockfile-audit-unreachable-base
        run: |
          mkdir -p "$FIXTURE_DIR"
          cd "$FIXTURE_DIR"
          git init -q
          git config user.email test@example.com
          git config user.name test

          cp "$GITHUB_WORKSPACE/tests/lockfile-audit/base/package.json" .
          pnpm install --no-frozen-lockfile
          git add -A
          git commit -q -m only-commit
          echo "fixture-dir=$FIXTURE_DIR" >> "$GITHUB_OUTPUT"

      - name: "Test: a base-sha absent from this checkout's history fails hard"
        id: audit
        continue-on-error: true
        uses: ./lockfile-audit
        with:
          working-directory: ${{ steps.fixture.outputs.fixture-dir }}
          # Well-formed but unreachable in this fixture's tiny history —
          # simulates a caller that forgot fetch-depth: 0.
          base-sha: "ffffffffffffffffffffffffffffffffffffffff"

      - name: "Verify: outcome must be failure"
        env:
          OUTCOME: ${{ steps.audit.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::Expected lockfile-audit to fail hard when base-sha isn't reachable in this checkout"
            exit 1
          fi
