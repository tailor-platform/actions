name: Lockfile Audit

on:
  push:
    branches: [main]
    paths:
      - "pnpm-lock.yaml"
      - "tests/deploy/pnpm-lock.yaml"
  pull_request:
    paths:
      - "pnpm-lock.yaml"
      - "tests/deploy/pnpm-lock.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  audit:
    name: Audit lockfile (${{ matrix.working-directory }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        working-directory: [".", "tests/deploy"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.8.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0

      - name: Audit lockfile for vulnerabilities
        uses: $/lockfile-audit
        with:
          working-directory: ${{ matrix.working-directory }}
