name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - v2

permissions: {}

jobs:
  cli-bin-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:cli-bin-contract

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: reviewdog/action-actionlint@6fb7acc99f4a1008869fa8a0f09cfca740837d9d # v1.72.0
        with:
          reporter: github-pr-review

  internal-refs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Ensure _internal actions are SHA-pinned to a commit already on the base branch
        env:
          # On a pull_request, the base branch is the PR's target (base_ref); on a
          # direct push, it's the branch that was pushed (ref_name). Hardcoding "main"
          # here would make this check meaningless on any other long-lived line (e.g.
          # a "v2" branch), since its own commits are never ancestors of origin/main.
          BASE_BRANCH: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
        run: |
          set -uo pipefail
          git fetch origin "$BASE_BRANCH" --quiet
          FAILED=0

          # Local-path refs (./_internal/...) resolve relative to the CALLER's checkout,
          # not this repo's, so they break the moment an external repo consumes the outer
          # action via `uses: tailor-platform/actions/<name>@<ref>`. Restrict this check to
          # published action.yaml/action.yml files — .github/workflows/*.yaml test files
          # invoke _internal actions directly from this same repo/commit, where local paths
          # are correct and required.
          mapfile -t ACTION_FILES < <(find . -type d -name node_modules -prune -o -type f \( -name 'action.yaml' -o -name 'action.yml' \) -print)
          if [ "${#ACTION_FILES[@]}" -gt 0 ]; then
            while IFS=: read -r file line rest; do
              echo "::error file=$file,line=$line::_internal/* actions must be referenced via a SHA-pinned tailor-platform/actions/_internal/<name>@<sha> ref, not a local path (./_internal/...). Local paths break for external consumers of this repo's actions."
              FAILED=1
            done < <(grep -nE 'uses:[[:space:]]*\./_internal/' "${ACTION_FILES[@]}")
          fi

          # Every pin must already be reachable from origin/$BASE_BRANCH, never a commit
          # that only lives on the branch/PR being edited right now — otherwise a later
          # amend/rebase orphans it (impostor-commit) after CI already went green on the
          # doomed SHA.
          while IFS=: read -r file line rest; do
            sha=$(printf '%s' "$rest" | grep -oE '_internal/[a-zA-Z0-9_-]+@[0-9a-f]{40}' | grep -oE '[0-9a-f]{40}$')
            [ -z "$sha" ] && continue
            if ! git merge-base --is-ancestor "$sha" "origin/$BASE_BRANCH" 2>/dev/null; then
              echo "::error file=$file,line=$line::_internal ref $sha is not part of origin/$BASE_BRANCH's history yet. Pinning to a commit that only exists on this branch/PR is fragile: rebasing or amending later orphans it. Merge the _internal change to $BASE_BRANCH first, then bump this pin to point at the resulting commit."
              FAILED=1
            fi
          done < <(grep -rnE 'uses:[[:space:]]*tailor-platform/actions/_internal/' --include='*.yaml' --include='*.yml' .)

          if [ "$FAILED" -eq 1 ]; then
            exit 1
          fi
          echo "OK: all _internal/* references are SHA-pinned and already on origin/$BASE_BRANCH."

  ghalint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install ghalint
        run: |
          go install github.com/suzuki-shunsuke/ghalint/cmd/ghalint@v1.5.6
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Lint workflows
        run: ghalint run
      - name: Lint action.yaml definitions
        run: ghalint run-action

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@6599ee8b7a49aef6a770f63d261d214911a7ce02 # v0.6.0
        with:
          advanced-security: false
          annotations: true
