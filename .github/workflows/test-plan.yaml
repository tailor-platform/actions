name: Test Plan Action

on:
  pull_request:
    paths:
      - "plan/**"
      - "tests/deploy/**"
      - ".github/workflows/test-plan.yaml"
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: test-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Secrets are not available for PRs from forks
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.22.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: tests/deploy/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: tests/deploy
        run: pnpm install

      - name: Create test workspace
        id: setup
        working-directory: tests/deploy
        env:
          TAILOR_PLATFORM_MACHINE_USER_CLIENT_ID: ${{ secrets.PLATFORM_MACHINE_USER_CLIENT_ID }}
          TAILOR_PLATFORM_MACHINE_USER_CLIENT_SECRET: ${{ secrets.PLATFORM_MACHINE_USER_CLIENT_SECRET }}
          TAILOR_PLATFORM_ORGANIZATION_ID: ${{ vars.TAILOR_PLATFORM_ORGANIZATION_ID }}
          TAILOR_PLATFORM_FOLDER_ID: ${{ vars.TAILOR_PLATFORM_FOLDER_ID }}
        run: |
          npx tailor login --machine-user

          CREATE_ARGS=(--name "actions-plan-test-${{ github.run_id }}" --region asia-northeast --organization-id "$TAILOR_PLATFORM_ORGANIZATION_ID")
          if [ -n "$TAILOR_PLATFORM_FOLDER_ID" ]; then
            CREATE_ARGS+=(--folder-id "$TAILOR_PLATFORM_FOLDER_ID")
          fi
          WORKSPACE_ID=$(npx tailor workspace create -j "${CREATE_ARGS[@]}" | jq -r '.id')
          echo "workspace-id=$WORKSPACE_ID" >> "$GITHUB_OUTPUT"
          echo "Created test workspace: $WORKSPACE_ID"

      - name: Run plan action (with workspace-id)
        uses: ./plan
        with:
          workspace-id: ${{ steps.setup.outputs.workspace-id }}
          label: test-plan
          working-directory: tests/deploy
          platform-client-id: ${{ secrets.PLATFORM_MACHINE_USER_CLIENT_ID }}
          platform-client-secret: ${{ secrets.PLATFORM_MACHINE_USER_CLIENT_SECRET }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Empty workspace-id: a plan for a workspace that is not provisioned yet must
      # succeed (chicken-and-egg for plans on PRs before the first deploy). The
      # action reports "not provisioned" instead of running a dry-run. No
      # github-token is passed here, so no PR comment is posted (summary only).
      - name: Run plan action (empty workspace-id, not provisioned)
        uses: ./plan
        with:
          workspace-id: ""
          working-directory: tests/deploy
          platform-client-id: ${{ secrets.PLATFORM_MACHINE_USER_CLIENT_ID }}
          platform-client-secret: ${{ secrets.PLATFORM_MACHINE_USER_CLIENT_SECRET }}

      - name: Cleanup workspace
        if: always() && steps.setup.outputs.workspace-id != ''
        working-directory: tests/deploy
        env:
          WORKSPACE_ID: ${{ steps.setup.outputs.workspace-id }}
        run: npx tailor workspace delete --workspace-id "$WORKSPACE_ID" --yes
