name: Post Tailor Platform preview comment
description: >-
  Post or update a PR comment with the preview deployment status, workspace ID,
  and optional @mention. Call this after preview-deploy completes.

inputs:
  workspace-id:
    description: Workspace ID of the preview deployment
    required: true
  workspace-name:
    description: Workspace name of the preview deployment
    required: true
  status:
    description: >-
      Deployment status: 'success', 'failure', or 'deleted' (after cleanup).
    required: true
  app-url:
    description: Application URL of the deployed preview workspace
    required: false
    default: ""
  expires-at:
    description: >-
      Instant at which the preview workspace becomes prunable, as UTC ISO 8601
      (e.g. 2026-10-27T12:00:00Z). Pass the `expires-at` output of
      preview-deploy. Adds an Expires row to the comment. Empty (default)
      adds no row, and the row is never added when `status` is 'deleted'. The
      comment is rebuilt on every push, so on a push where preview-deploy could
      not record the expiry (empty output) the row is gone until a later push
      records it.
    required: false
    default: ""
  timezones:
    description: >-
      IANA timezone names (e.g. Asia/Tokyo) in which to show the expiry,
      separated by commas or newlines. The expiry is shown once per timezone,
      one under the other in the order given. A name that is not a known timezone is skipped with a
      warning; when none is valid, UTC is used. Only used with `expires-at`.
    required: false
    default: UTC
  github-token:
    description: GitHub token with pull-requests:write permission
    required: true
  mention:
    description: >-
      Set to "true" to @mention the commit/PR author. Mentions the commit
      author; falls back to the PR author if the commit was by a bot; skips
      if both are bots.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Build comment body
      id: build
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_ENTERPRISE_TOKEN: ${{ inputs.github-token }}
        WORKSPACE_ID: ${{ inputs.workspace-id }}
        WORKSPACE_NAME: ${{ inputs.workspace-name }}
        STATUS: ${{ inputs.status }}
        APP_URL: ${{ inputs.app-url }}
        EXPIRES_AT: ${{ inputs.expires-at }}
        TIMEZONES: ${{ inputs.timezones }}
        MENTION_ENABLED: ${{ inputs.mention }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        export GH_HOST="${GITHUB_SERVER_URL#*://}"
        if [ -z "$PR_NUMBER" ]; then
          echo "::notice::Not a pull_request event — skipping preview comment"
          exit 0
        fi

        MARKER="<!-- tailor-preview: $WORKSPACE_NAME id=$WORKSPACE_ID -->"

        MENTION_USER=""
        if [ "$MENTION_ENABLED" = "true" ]; then
          COMMIT_AUTHOR=$(gh api "repos/$GITHUB_REPOSITORY/commits/$PR_HEAD_SHA" \
            --jq '.author.login // empty' 2>/dev/null || echo "")
          if [ -n "$COMMIT_AUTHOR" ] && [[ "$COMMIT_AUTHOR" != *"[bot]" ]]; then
            MENTION_USER="@$COMMIT_AUTHOR"
          else
            PR_AUTHOR=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
              --jq '.user.login // empty' 2>/dev/null || echo "")
            if [ -n "$PR_AUTHOR" ] && [[ "$PR_AUTHOR" != *"[bot]" ]]; then
              MENTION_USER="@$PR_AUTHOR"
            fi
          fi
        fi

        case "$STATUS" in
          success) EMOJI="✅"; STATUS_TEXT="Deployed" ;;
          failure) EMOJI="❌"; STATUS_TEXT="Failed" ;;
          deleted) EMOJI="🗑️"; STATUS_TEXT="Cleaned up" ;;
          *)       EMOJI="ℹ️"; STATUS_TEXT="$STATUS" ;;
        esac

        TABLE="| | |"$'\n'"|---|---|"$'\n'"| Workspace ID | \`${WORKSPACE_ID}\` |"$'\n'"| Status | ${EMOJI} ${STATUS_TEXT} |"
        [ -n "$APP_URL" ] && TABLE="${TABLE}"$'\n'"| App URL | <${APP_URL}> |"

        # GNU date reads `-d @epoch` and BSD date `-r epoch`, so try one, then the other.
        printable() { printf '%s' "${1//[^A-Za-z0-9_ \/+:.-]/?}"; }
        iso_to_epoch() {
          date -u -d "$1" +%s 2>/dev/null ||
            date -u -j -f '%Y-%m-%dT%H:%M:%SZ' "$1" +%s 2>/dev/null
        }
        epoch_in_zone() {
          TZ="$2" date -d "@$1" '+%Y-%m-%d %H:%M' 2>/dev/null ||
            TZ="$2" date -r "$1" '+%Y-%m-%d %H:%M'
        }
        zone_is_known() {
          [[ "$1" =~ ^[A-Za-z0-9_+-]+(/[A-Za-z0-9_+-]+)*$ ]] &&
            { [ "$1" = "UTC" ] || [ -f "/usr/share/zoneinfo/$1" ]; }
        }

        if [ -n "$EXPIRES_AT" ] && [ "$STATUS" != "deleted" ]; then
          EXPIRES_EPOCH=""
          if [[ "$EXPIRES_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]; then
            EXPIRES_EPOCH=$(iso_to_epoch "$EXPIRES_AT") || EXPIRES_EPOCH=""
          fi
          if [ -z "$EXPIRES_EPOCH" ]; then
            echo "::warning::Ignoring expires-at '$(printable "$EXPIRES_AT")': expected UTC ISO 8601 such as 2026-10-27T12:00:00Z"
          else
            EXPIRES_TEXT=""
            while IFS= read -r ZONE; do
              ZONE="${ZONE#"${ZONE%%[![:space:]]*}"}"
              ZONE="${ZONE%"${ZONE##*[![:space:]]}"}"
              [ -z "$ZONE" ] && continue
              if ! zone_is_known "$ZONE"; then
                echo "::warning::Skipping timezone '$(printable "$ZONE")': not a known IANA timezone name"
                continue
              fi
              EXPIRES_TEXT="${EXPIRES_TEXT:+${EXPIRES_TEXT}<br>}$(epoch_in_zone "$EXPIRES_EPOCH" "$ZONE") ${ZONE}"
            done < <(printf '%s\n' "$TIMEZONES" | tr ',' '\n')
            [ -z "$EXPIRES_TEXT" ] && EXPIRES_TEXT="$(epoch_in_zone "$EXPIRES_EPOCH" UTC) UTC"
            TABLE="${TABLE}"$'\n'"| Expires | ${EXPIRES_TEXT} |"
          fi
        fi

        if [ -n "$MENTION_USER" ]; then
          FOOTER="${MENTION_USER} — ${STATUS_TEXT}. [View run](${RUN_URL})"
        else
          FOOTER="[View run](${RUN_URL})"
        fi

        BODY="${MARKER}"$'\n'"## ${EMOJI} Tailor Platform Preview (\`${WORKSPACE_NAME}\`)"$'\n\n'"${TABLE}"$'\n\n'"${FOOTER}"

        EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
        {
          echo "body<<$EOF"
          echo "$BODY"
          echo "$EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Post or update preview comment
      if: github.event.pull_request.number != ''
      uses: tailor-platform/actions/_internal/sticky-comment@bed6c5a2dc015d45d78931d9e8989109ec27fc28
      with:
        marker-prefix: "<!-- tailor-preview: ${{ inputs.workspace-name }} "
        body: ${{ steps.build.outputs.body }}
        github-token: ${{ inputs.github-token }}
