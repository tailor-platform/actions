name: Delete Tailor Platform preview workspace
description: >-
  Delete the per-PR preview workspace when a pull request is closed.
  Reads the workspace ID from the PR comment posted by preview-comment and
  deletes the workspace. Run this on pull_request closed events.
  Requires Node.js and dependencies to be installed by the caller.

inputs:
  workspace-name-prefix:
    description: >-
      The same prefix used in preview-deploy. Used to locate the PR comment
      that holds the workspace ID.
    required: true
  prune-expired:
    description: >-
      Set to "true" to also delete this app's other preview workspaces whose
      expiry (the `ttl` input of preview-deploy) has passed, right after the
      per-PR workspace is deleted. Workspaces without a recorded expiry are
      never deleted this way. Runs even when deleting the per-PR workspace
      failed. Needs `folder-id`, `organization-id`, or the
      TAILOR_PLATFORM_ORGANIZATION_ID environment variable; with none of them
      the sweep is skipped with a warning.
    required: false
    default: "false"
  organization-id:
    description: >-
      Organization whose root (workspaces outside any folder) is swept when
      `folder-id` is empty. Use the same value as preview-deploy. Defaults to
      the TAILOR_PLATFORM_ORGANIZATION_ID environment variable. Only used when
      `prune-expired` is "true".
    required: false
    default: ""
  folder-id:
    description: >-
      Folder swept for expired preview workspaces. Use the same value as
      preview-deploy. Takes precedence over `organization-id`, matching where
      preview-deploy creates the workspace. Only used when `prune-expired` is
      "true".
    required: false
    default: ""
  working-directory:
    description: Working directory for the project (for monorepo setups)
    required: false
    default: "."
  package-manager:
    description: >-
      Package manager used to run tailor (pnpm, npm, yarn, or bun).
      Defaults to npx when empty.
    required: false
    default: ""
  platform-client-id:
    description: OAuth2 client ID for Tailor Platform machine user
    required: true
  platform-client-secret:
    description: OAuth2 client secret for Tailor Platform machine user
    required: true
  github-token:
    description: >-
      GitHub token for reading the PR comment and updating it after cleanup.
      Requires pull-requests:write permission.
    required: true

runs:
  using: composite
  steps:
    - name: Set up Tailor SDK
      uses: tailor-platform/actions/_internal/sdk-setup@053ee1c31460fc04639c466e5f483ea3150a9a31
      with:
        platform-client-id: ${{ inputs.platform-client-id }}
        platform-client-secret: ${{ inputs.platform-client-secret }}
        package-manager: ${{ inputs.package-manager }}
        working-directory: ${{ inputs.working-directory }}

    - name: Delete preview workspace
      id: delete
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        NAME_PREFIX: ${{ inputs.workspace-name-prefix }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        if [ -z "$PR_NUMBER" ]; then
          echo "::error::preview-cleanup must run on a pull_request event"
          exit 1
        fi

        WORKSPACE_NAME="${NAME_PREFIX}-pr-${PR_NUMBER}"
        MARKER_PREFIX="<!-- tailor-preview: $WORKSPACE_NAME id="

        COMMENT=$(gh api --paginate --slurp \
          "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" | \
          jq -r --arg m "$MARKER_PREFIX" \
            '[ .[][] | select(.user.type == "Bot" and (.body | startswith($m))) ] | first | .body // empty')

        WORKSPACE_ID=$(echo "$COMMENT" | \
          jq -rR '(try capture("<!-- tailor-preview: [^ ]+ id=(?<id>[a-f0-9-]+)") | .id) // empty')

        if [ -z "$WORKSPACE_ID" ]; then
          echo "::warning::No preview workspace ID found in PR comment — skipping deletion"
          exit 0
        fi

        echo "Deleting preview workspace: $WORKSPACE_NAME ($WORKSPACE_ID)"
        $TAILOR_RUN tailor workspace delete --workspace-id "$WORKSPACE_ID" --yes

        echo "workspace-id=$WORKSPACE_ID" >> "$GITHUB_OUTPUT"
        echo "workspace-name=$WORKSPACE_NAME" >> "$GITHUB_OUTPUT"

    - name: Build cleanup comment body
      id: body
      if: steps.delete.outputs.workspace-id != ''
      shell: bash
      env:
        WORKSPACE_ID: ${{ steps.delete.outputs.workspace-id }}
        WORKSPACE_NAME: ${{ steps.delete.outputs.workspace-name }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        MARKER="<!-- tailor-preview: $WORKSPACE_NAME id=$WORKSPACE_ID -->"
        TABLE="| | |"$'\n'"|---|---|"$'\n'"| Workspace ID | \`${WORKSPACE_ID}\` |"$'\n'"| Status | 🗑️ Cleaned up |"
        BODY="${MARKER}"$'\n'"## 🗑️ Tailor Platform Preview (\`${WORKSPACE_NAME}\`) — Cleaned Up"$'\n\n'"${TABLE}"$'\n\n'"[View run](${RUN_URL})"

        EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
        {
          echo "body<<$EOF"
          echo "$BODY"
          echo "$EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Update preview comment
      if: steps.delete.outputs.workspace-id != ''
      uses: tailor-platform/actions/_internal/sticky-comment@d203a37c87b7a69c6040611c33e9e50c1d564ed1
      with:
        marker-prefix: "<!-- tailor-preview: ${{ steps.delete.outputs.workspace-name }} "
        body: ${{ steps.body.outputs.body }}
        github-token: ${{ inputs.github-token }}

    - name: Prune expired preview workspaces
      id: prune
      if: ${{ !cancelled() && inputs.prune-expired == 'true' }}
      shell: bash
      env:
        NAME_PREFIX: ${{ inputs.workspace-name-prefix }}
        ORG_ID: ${{ inputs.organization-id }}
        FOLDER_ID: ${{ inputs.folder-id }}
      run: |
        ORG_ID="${ORG_ID:-${TAILOR_PLATFORM_ORGANIZATION_ID:-}}"
        if [ -n "$FOLDER_ID" ]; then
          LOCATION=(--folder-id "$FOLDER_ID")
        elif [ -n "$ORG_ID" ]; then
          LOCATION=(--organization-root "$ORG_ID")
        else
          echo "::warning::prune-expired needs folder-id or organization-id — skipping the sweep of expired preview workspaces"
          exit 0
        fi

        NAME_PATTERN="$(printf '%s' "$NAME_PREFIX" | sed 's/[][\.*^$(){}?+|/]/\\&/g')-pr-[0-9]+"

        echo "Pruning expired preview workspaces matching: $NAME_PATTERN"
        $TAILOR_RUN tailor workspace prune --expired --yes --limit 0 "${LOCATION[@]}" --name "$NAME_PATTERN"
